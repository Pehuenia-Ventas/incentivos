<style>
/* Layout: barra superior con estado de datos + pestañas; cada pestaña abre con "Cómo se lee" y luego la tabla/tarjetas. */

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151D; --surface:#17202B; --surface2:#1F2A37; --line:#2E3B4B; --ink:#E7ECF3; --ink2:#AFBACA; --muted:#8693A6;
  --accent:#7D9BFF; --accent-soft:#25335E; --accent2:#4CC9C4; --accent2-soft:#173B3D;
  --good:#5FD08C; --good-bg:#173726; --warn:#F0B54A; --warn-bg:#3B2E12; --bad:#FF8A80; --bad-bg:#43201E;
  --ticket-empty:#2A3645; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F151D; --surface:#17202B; --surface2:#1F2A37; --line:#2E3B4B; --ink:#E7ECF3; --ink2:#AFBACA; --muted:#8693A6;
  --accent:#7D9BFF; --accent-soft:#25335E; --accent2:#4CC9C4; --accent2-soft:#173B3D;
  --good:#5FD08C; --good-bg:#173726; --warn:#F0B54A; --warn-bg:#3B2E12; --bad:#FF8A80; --bad-bg:#43201E;
  --ticket-empty:#2A3645; color-scheme:dark;}
[hidden]{display:none!important}
.ro .edit-only{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}

tr.click{cursor:pointer}

/* Ficha */

/* Gráfico */
.chart{width:100%;height:auto;display:block}

.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:13px;z-index:50;white-space:nowrap}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px;background:var(--surface)}
.empty p{margin:4px 0 0;max-width:70ch;color:var(--ink2)}
.bt-yes{color:var(--good);font-weight:800;font-size:17px}
.bt-no{color:var(--bad);font-weight:800;font-size:17px}
.bt-yes,.bt-no{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:6px}
.bt-yes{background:var(--good-bg)} .bt-no{background:var(--bad-bg)}
.daychips{display:flex;flex-wrap:wrap;gap:6px}
.daychip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;cursor:pointer;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.prose{max-width:80ch}

.prose p,.prose li{color:var(--ink2)}
.prose ol,.prose ul{padding-left:22px;display:grid;gap:6px}
.formula{font-family:var(--f-display);font-size:20px;font-weight:600;background:var(--accent-soft);padding:10px 14px;border-radius:8px;color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.section{margin-top:22px}
.overlay{position:fixed;inset:0;background:rgba(10,15,22,.55);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:22px;max-width:520px;width:100%;display:grid;gap:12px}
.spinner{width:22px;height:22px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
@media (max-width:560px){h1{font-size:28px}.kpi .v{font-size:28px}.wrap{padding-inline:16px}}
.cobtags{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.cobtag{border-top:4px solid var(--line)}.cobtag.good{border-top-color:var(--good)}.cobtag.warn{border-top-color:var(--warn)}.cobtag.bad{border-top-color:var(--bad)}
.cobtag.good .bar i{background:var(--good)}.cobtag.warn .bar i{background:var(--warn)}.cobtag.bad .bar i{background:var(--bad)}
.cobtag .v{font-size:30px}
</style>

<div class="wrap">
  <header class="top">
    <div class="ttl">
      <span class="eyebrow">Primeros Productos Pehuenia · Otras marcas + Cobertura Georgalos</span>
      <h1>Incentivo Moto · <span id="mesLabel"></span><span id="soloName"></span></h1>
    </div>

<script>
const CFG = /*CFG_START*/null/*CFG_END*/;
/* ===== Núcleo de cálculo (mismo criterio que el Excel "Modelo de incentivo") ===== */
const GBR = ['Chocolates','Caramelos blandos','Chocolate en polvo','Pasta de maní','Galletitas Toddy','Cobertura general'];
const GSHORT = {'Chocolates':'Chocolates','Caramelos blandos':'Caram. blandos','Chocolate en polvo':'Choc. en polvo','Pasta de maní':'Pasta de maní','Galletitas Toddy':'Galletitas Toddy','Cobertura general':'General Georgalos'};
function norm(s){ return String(s == null ? '' : s).trim().toUpperCase().replace(/\s+/g,' '); }
function ceilX(x){ return Math.ceil(+(+x).toFixed(9)); }
function pad2(n){ return (n<10?'0':'')+n; }
function toYMD(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number' && isFinite(v)) {
    if (v < 1000) return null;
    const d = new Date(Math.round((Math.floor(v) - 25569) * 86400000));
    return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());
  }
  if (v instanceof Date && !isNaN(v)) return v.getFullYear()+'-'+pad2(v.getMonth()+1)+'-'+pad2(v.getDate());
  const s = String(v).trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if (m) return m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);
  m = /^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/.exec(s);
  if (m) return m[3]+'-'+pad2(+m[2])+'-'+pad2(+m[1]);
  return null;
}
function toNum(v){
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (v == null || v === '') return 0;
  let s = String(v).trim();
  if (/,\d{1,2}$/.test(s) || (s.includes(',') && s.includes('.') && s.lastIndexOf(',') > s.lastIndexOf('.'))) s = s.replace(/\./g,'').replace(',', '.');
  else s = s.replace(/,/g,'');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
}


function parseCSV(t, sep){
  const out=[]; let row=[], f='', q=false, i=0, n=t.length;
  while(i<n){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ f+='"'; i+=2; continue; } q=false; i++; continue; } f+=ch; i++; continue; }
    if(ch==='"' && f===''){ q=true; i++; continue; }
    if(ch===sep){ row.push(f); f=''; i++; continue; }
    if(ch==='\r'){ i++; continue; }
    if(ch==='\n'){ row.push(f); out.push(row); row=[]; f=''; i++; continue; }
    f+=ch; i++; }
  if(f!==''||row.length){ row.push(f); out.push(row); }
  return out;
}

const REQ = ['Cliente','FechaComprobante','FechaEntrega','TipoDeVenta','CodVendedor','Vendedor','Proveedor','Articulo','CantBase','ImporteNetoItem'];

/* rows: array de arrays (primera fila útil = encabezado). Devuelve el "snapshot" que se guarda. */
function aggregate(rows, CFG){
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 30); i++) {
    const r = rows[i] || [];
    if (r.some(c => norm(c) === 'IMPORTENETOITEM')) { h = i; break; }
  }
  if (h < 0) throw new Error('No encontré la columna "ImporteNetoItem". Revisá que el archivo sea el "Detallado de ventas" (o el modelo con la hoja de ventas).');
  const head = rows[h].map(norm);
  const ix = {};
  const miss = [];
  for (const k of REQ.concat(['RazonSocial'])) { const j = head.indexOf(norm(k)); ix[k] = j; if (j < 0 && REQ.includes(k)) miss.push(k); }
  if (miss.length) throw new Error('Faltan columnas en el archivo: ' + miss.join(', ') + '.');

  const pref = CFG.mes.y + '-' + pad2(CFG.mes.m);
  const nb = CFG.brands.length;
  const bIdx = {}; CFG.brands.forEach((b,i) => bIdx[norm(b.full)] = i);
  const excl = norm(CFG.excluida);
  const vCod = {}; CFG.vend.forEach(v => vCod[v.cod] = v);
  const real = {}; CFG.vend.forEach(v => real[v.cod] = new Array(nb).fill(0));
  const arts = {}; for (const k in CFG.arts) arts[norm(k)] = CFG.arts[k];
  const disp = new Set((CFG.display || []).map(norm)), fuera = new Set((CFG.fueraGeneral || []).map(norm));
  const provG = norm(CFG.provGeorgalos || 'GEORGALOS HNOS S A I C A'), minU = CFG.minUnid || 3;
  const units = new Map();
  const otros = {}, daily = {}, dailyV = {};
  let minD = null, maxD = null, minM = null, maxM = null, nMes = 0, nTot = 0, sinFecha = 0, porEntrega = 0;

  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r) continue;
    const cli = r[ix.Cliente]; if (cli == null || cli === '') continue;
    nTot++;
    let f = toYMD(r[ix.FechaComprobante]);
    if (!f) { f = toYMD(r[ix.FechaEntrega]); if (f) porEntrega++; }
    if (!f) { sinFecha++; continue; }
    if (!minD || f < minD) minD = f; if (!maxD || f > maxD) maxD = f;
    if (f.slice(0,7) !== pref) continue;
    nMes++;
    if (!minM || f < minM) minM = f; if (!maxM || f > maxM) maxM = f;
    const cod = Math.round(toNum(r[ix.CodVendedor]));
    const vname = norm(r[ix.Vendedor]);
    // cobertura Georgalos: unidades de venta menos rechazos; un display/estuche vale como el mínimo completo
    const prov = norm(r[ix.Proveedor]);
    const tipo = norm(r[ix.TipoDeVenta]);
    if (tipo === 'VENTA' || tipo.includes('RECHAZO')) {
      const an = norm(r[ix.Articulo]);
      const q = toNum(r[ix.CantBase]) * (disp.has(an) ? minU : 1);
      const add = gb => { const key = vname + '|' + String(cli).trim() + '|' + gb; units.set(key, (units.get(key) || 0) + q); };
      const g = arts[an]; if (g) add(g);
      if (prov === provG && !fuera.has(an)) add('Cobertura general');
    }
    if (prov === excl) continue;
    const v = vCod[cod]; if (!v) continue;
    const imp = toNum(r[ix.ImporteNetoItem]);
    const bi = bIdx[prov];
    if (bi != null) real[cod][bi] += imp;
    else { const pn = String(r[ix.Proveedor] || '(sin proveedor)').trim(); otros[pn] = (otros[pn] || 0) + imp; }
    daily[f] = (daily[f] || 0) + imp;
    (dailyV[cod] = dailyV[cod] || {})[f] = (dailyV[cod][f] || 0) + imp;
  }
  const cob = {};
  units.forEach((u, key) => {
    if (!(u >= minU - 1e-9)) return;
    const [vn, c, gb] = key.split('|');

/* ===== ¿Planifiqué bien? Evaluación de la planificación diaria por marca =====

  const F = (CFG.objDia || {})[v.cod] || {}, D = ((SNAP && SNAP.dailyVB) || {})[v.cod] || {}, C = ((SNAP && SNAP.cvb) || {})[v.cod] || {};

/* Cálculo de cupones a partir del snapshot (o vacío si todavía no hay ventas). */
function compute(CFG, SNAP){
  const P = CFG.params, nb = CFG.brands.length;
  const hab = CFG.habiles;

  const diasTot = hab.length;
  const diasRest = diasTot - diasTrans;
  const esperado = diasTot ? diasTrans / diasTot : 0;
  const vs = CFG.vend.map(v => {
    const real = (SNAP && SNAP.real && SNAP.real[v.cod]) ? SNAP.real[v.cod].slice() : new Array(nb).fill(0);

    const cartSet = new Set((CFG.cart[v.nom] || []).map(String));

    const cobPct = cobCnt.map((c,i) => need[i] > 0 ? c / need[i] : null);
    const nCob = cobPct.filter(p => p != null && p >= 1 - 1e-12).length;

  });

    const mine = vs.filter(v => v.sup === s);

    const conObj = obj.filter(o => o > 0).length;
    const n100 = pctB.filter(p => p != null && p >= P.cumpl - 1e-12).length;
    const objT = obj.reduce((a,b) => a + b, 0), realT = real.reduce((a,b) => a + b, 0);

    const todas = conObj > 0 && n100 === conObj;

    const tot100 = objT > 0 && pct >= P.cumpl - 1e-12;
    const B = todas ? P.cupPlus : 0;
    const cartera = mine.reduce((a,v) => a + v.cartera, 0);
    const cobCnt = GBR.map((g,i) => mine.reduce((a,v) => a + v.cobCnt[i], 0));

    const nCob = cobPct.filter(p => p != null && p >= 1 - 1e-12).length;
    const C = nCob * P.cupCob;

  });

}

function rankingList(vs){

function chartSVG(vs){
  const cods = new Set(vs.map(v => String(v.cod)));
  const objT = vs.reduce((a,v) => a + v.objT, 0);
  const days = CFG.habiles;
  const W = 1100, H = 300, L = 62, Rr = 14, T = 14, B = 30;
  let cum = 0; const pts = [];
  if (SNAP && SNAP.dailyV) {
    const all = {};
    for (const c in SNAP.dailyV) if (cods.has(c)) for (const d in SNAP.dailyV[c]) all[d] = (all[d] || 0) + SNAP.dailyV[c][d];
    const ds = Object.keys(all).sort();
    days.forEach((d,i) => { if (!R.lastD || d > R.lastD) return; ds.filter(x => x <= d && (i === 0 || x > days[i-1])).forEach(x => cum += all[x]); pts.push([i, cum, d]); });
    if (pts.length) { const lp = pts[pts.length-1]; ds.filter(x => x > lp[2]).forEach(x => lp[1] += all[x]); cum = lp[1]; }
  }
  const maxY = Math.max(objT, cum) * 1.05 || 1;
  const x = i => L + (W - L - Rr) * (days.length > 1 ? i / (days.length - 1) : 0);
  const y = v => T + (H - T - B) * (1 - v / maxY);
  const step = maxY > 4e8 ? 1e8 : maxY > 1.5e8 ? 5e7 : maxY > 4e7 ? 1e7 : 5e6;
  let g = '';
  for (let v = 0; v <= maxY; v += step) g += `<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v === 0 ? '0' : (v/1e6).toLocaleString('es-AR') + ' M'}</text>`;
  days.forEach((d,i) => { if (i % 3 === 0 || i === days.length - 1) g += `<text x="${x(i)}" y="${H-10}" text-anchor="middle">${fmtDate(d)}</text>`; });
  g += `<line class="obj" x1="${x(0)}" y1="${y(objT/days.length)}" x2="${x(days.length-1)}" y2="${y(objT)}"/><text x="${W-Rr}" y="${y(objT)-6}" text-anchor="end">Objetivo ${fmtMk(objT)}</text>`;
  if (pts.length) {
    const line = pts.map((p,k) => (k ? 'L' : 'M') + x(p[0]) + ',' + y(p[1])).join(' ');
    g += `<path class="area" d="${line} L${x(pts[pts.length-1][0])},${y(0)} L${x(pts[0][0])},${y(0)} Z"/><path class="line" d="${line}"/>`;
    const lp = pts[pts.length-1];
    g += `<circle cx="${x(lp[0])}" cy="${y(lp[1])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  } else {
    g += `<text x="${(L+W)/2}" y="${H/2}" text-anchor="middle" style="font-size:14px">La curva aparece con la primera carga de ventas</text>`;
  }
  const data = encodeURIComponent(JSON.stringify(pts.map(p => [p[0], p[1], p[2], objT / days.length * (p[0] + 1)])));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" data-pts="${data}" data-geo="${L},${W-Rr},${days.length}" role="img" aria-label="Facturación acumulada contra objetivo">${g}<rect x="${L}" y="${T}" width="${W-L-Rr}" height="${H-T-B}" fill="transparent" class="hit"/></svg>`;
}

/* ===================== ¿Planifiqué bien? =====================

  const hoy = (SNAP && SNAP.hoy) || HOYAR, ini = P.planIni, H = (CFG.habiles || []).slice().sort();
  const pctT = x => x == null ? '—' : x === Infinity ? '—' : Math.round(x * 100) + '%';

        const ojo = sinV ? `Para llegar al mes necesitás más del ${Math.round(hi * 100)}% de tus visitas: queda ambicioso, suma solo si llegás.` : dv != null && dv > 0.2 ? `Venís planificando ${dv > 3 ? 'más del 300%' : Math.round(dv * 100) + '%'} arriba de lo que vendés.` : dv != null && dv < -0.2 ? `Venís vendiendo más de lo que planificás: podés subirlo.` : '';

document.addEventListener('change', e => { const id = e.target.id; if (id === 'plDia' || id === 'plVen' || id === 'plSug') { st[id] = e.target.value; saveUI(); render(); } });

/* ===================== Marcas ===================== */
/* Venta del último día hábil completo (antes de hoy) contra lo que necesitaba ese día: lo que le faltaba para el objetivo del mes al empezar el día ÷ días hábiles que quedaban (incluido ese día) */
const DIAV = (function(){ const hoy = (SNAP && SNAP.hoy) || HOYAR; const ds = CFG.habiles.filter(d => d < hoy); return ds.length ? ds[ds.length - 1] : null; })();
function diaVend(v){ const dv = (SNAP && SNAP.dailyV && SNAP.dailyV[v.cod]) || {}; if (!DIAV) return null; const venta = dv[DIAV] || 0; let antes = 0; for (const d in dv) if (d < DIAV) antes += dv[d]; const rest = CFG.habiles.filter(d => d >= DIAV).length; const nec = rest ? Math.max(0, (v.objT - antes) / rest) : 0; return { venta, nec, diff: venta - nec, ok: v.objT > 0 && antes >= v.objT }; }
function diaCells(x){ if (!x) return '<td>—</td><td>—</td>'; const dif = x.ok ? '<span class="cell good" title="Ya había llegado al objetivo del mes">✓ cumplido</span>' : `<span class="cell ${x.diff >= 0 ? 'good' : 'bad'}" title="Necesitaba ${fmtMk(x.nec)} ese día">${x.diff >= 0 ? 'se pasó ' + fmtMk(x.diff) : 'faltó ' + fmtMk(-x.diff)}</span>`; return `<td class="tot" title="Necesitaba ${fmtMk(x.nec)}">${fmtMk(x.venta)}</td><td>${dif}</td>`; }
function viewMarcas(){
  const vs = vendFiltered();
  const mode = st.mMode || 'pct';
  const used = CFG.brands.map((b,i) => i).filter(i => vs.some(v => v.obj[i] > 0));
  let h = emptyBanner();
  h += howto('Cómo se lee el avance por marca', [
    'Cada celda es <b>lo facturado en el mes ÷ el objetivo de esa marca</b> para ese vendedor. Al llegar al 100% la marca suma puntos según su peso en el objetivo total (A: cada ' + P.ptsCup + ' puntos, 1 cupón, hasta ' + P.cupMarcas + ').',
    'El color compara contra el avance esperado a hoy (' + fmtP(R.esperado) + ' del mes hábil): así se ve qué marcas hay que empujar antes de que sea tarde.',
    'Con el selector podés ver el %, lo facturado, <b>cuánto falta</b> en pesos o <b>cuánto traer por día</b>: lo que falta (descontando la preventa ya cargada) dividido los ' + DQ + ' días hábiles que quedan. En ámbar si va atrasado contra el ritmo del mes.',
    (DIAV ? '<b>Venta del ' + fmtDate(DIAV) + '</b>: lo facturado ese día (último día hábil completo). <b>Faltó / se pasó</b>: contra lo que necesitaba vender ese día para llegar al objetivo total del mes (lo que le faltaba al empezar el día ÷ los días hábiles que quedaban, incluido ese día).' : ''),
    'Las marcas en las que el vendedor no tiene objetivo aparecen con "—" (no dan cupón). Peñaflor, New PGA y Pilares solo tienen objetivo en el equipo de Juan Armandola.'
  ]);
  if (SOLO && vs.length === 1) return h + marcasSolo(vs[0], used);
  h += `<div class="filters" style="margin-bottom:10px"><label for="mMode">Mostrar <select id="mMode"><option value="pct" ${mode==='pct'?'selected':''}>% de cumplimiento</option><option value="falta" ${mode==='falta'?'selected':''}>Cuánto falta ($)</option><option value="real" ${mode==='real'?'selected':''}>Facturado ($)</option><option value="obj" ${mode==='obj'?'selected':''}>Objetivo ($)</option><option value="dia" ${mode==='dia'?'selected':''}>Cuánto traer por día (con preventa)</option></select></label><span style="flex:1"></span>${exportBtn('tMar','avance_por_marca')}</div>`;
  h += statusLegend();
  h += `<div class="tw"><table id="tMar"><thead><tr><th class="l sticky1">Vendedor</th>${used.map(i => `<th>${esc(CFG.brands[i].short)}</th>`).join('')}<th>Total</th>${DIAV ? `<th>Venta del ${fmtDate(DIAV)}</th><th>Faltó / se pasó</th>` : ''}</tr></thead><tbody>`;
  const cell = (o, r, rp) => {
    if (!(o > 0)) return '<span class="cell na">—</span>';
    if (mode === 'dia') return needTag(o, rp == null ? r : rp, true);
    if (mode === 'pct') return cellP(r / o);
    if (mode === 'real') return fmtMk(r);
    if (mode === 'obj') return fmtMk(o);
    const f = o - r; return f <= 0 ? '<span class="cell good">✓ listo</span>' : `<span class="cell ${cls(r/o)}">${fmtMk(f)}</span>`;
  };
  for (const v of vs) h += `<tr class="click" data-ven="${v.cod}"><td class="l name sticky1">${esc(titleCase(v.nom))}</td>${used.map(i => `<td>${cell(v.obj[i], v.real[i], pvOf(v).real[i])}</td>`).join('')}<td>${cell(v.objT, v.realT, pvOf(v).realT)}</td>${DIAV ? diaCells(diaVend(v)) : ''}</tr>`;
  const so = i => vs.reduce((a,v) => a + v.obj[i], 0), sr = i => vs.reduce((a,v) => a + v.real[i], 0), sp = i => vs.reduce((a,v) => a + pvOf(v).real[i], 0);
  h += `</tbody><tfoot><tr><td class="l sticky1">Total</td>${used.map(i => `<td>${cell(so(i), sr(i), sp(i))}</td>`).join('')}<td>${cell(vs.reduce((a,v)=>a+v.objT,0), vs.reduce((a,v)=>a+v.realT,0), vs.reduce((a,v)=>a+pvOf(v).realT,0))}</td>${DIAV ? (function(){ const xs = vs.map(diaVend).filter(Boolean); const t = { venta: xs.reduce((a,x)=>a+x.venta,0), nec: xs.reduce((a,x)=>a+(x.ok?0:x.nec),0) }; t.diff = t.venta - t.nec; t.ok = false; return diaCells(t); })() : ''}</tr></tfoot></table></div>`;
  if (SNAP && SNAP.otros && Object.keys(SNAP.otros).length) {
    const o = Object.entries(SNAP.otros).filter(([k,v]) => Math.abs(v) > 1).sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]));
    if (o.length) h += `<p class="note">Facturación que no entra en ninguna marca del concurso (proveedor nuevo o renglones sin proveedor, como ajustes): ${o.map(([k,v]) => esc(k) + ' ' + fmtMk(v)).join(' · ')}. No suma a ningún objetivo.</p>`;
  }
  return h;
}

/* Link de un vendedor: las marcas una debajo de la otra, con la venta de la última y la penúltima visita (lo cargado hace 7 y 14 días) */
function marcasSolo(v, used){
  const hoy = (SNAP && SNAP.hoy) || HOYAR, menos = n => new Date(Date.parse(hoy + 'T12:00:00Z') - n * 864e5).toISOString().slice(0, 10);

  const vis = (f, i) => (CV[f] || [])[i] || 0, visT = f => (CV[f] || []).reduce((a, b) => a + b, 0);
  const rest = DIAV ? CFG.habiles.filter(d => d >= DIAV).length : 0;
  const diaB = i => { if (!DIAV) return null; const venta = (DV[DIAV] || [])[i] || 0; let antes = 0; for (const d in DV) if (d < DIAV) antes += (DV[d] || [])[i] || 0; const o = v.obj[i] || 0; const nec = rest ? Math.max(0, (o - antes) / rest) : 0; return { venta, nec, diff: venta - nec, ok: o > 0 && antes >= o }; };
  const pv = pvOf(v);
  const falta = (o, r) => { if (!(o > 0)) return '<span class="cell na">—</span>'; const f = o - r; return f <= 0 ? '<span class="cell good">✓ listo</span>' : `<span class="cell ${cls(r / o)}">${fmtMk(f)}</span>`; };
  const pct = (o, r) => o > 0 ? cellP(r / o) : '<span class="cell na">—</span>';
  const money = n => Math.abs(n) < 1 ? '<span class="muted">—</span>' : fmtMk(n);
  let h = `<div class="filters" style="margin-bottom:10px"><span style="flex:1"></span>${exportBtn('tMar','avance_por_marca')}</div>`;
  h += statusLegend();
  h += `<div class="tw"><table id="tMar"><thead><tr><th class="l sticky1">Marca</th><th>Objetivo</th><th>Facturado</th><th>Cumplimiento</th><th>Última visita<br><span class="muted" style="font-weight:500">${dl(V1)}</span></th><th>Penúltima visita<br><span class="muted" style="font-weight:500">${dl(V2)}</span></th><th>Cuánto falta</th><th>Por día (con preventa)</th>${DIAV ? `<th>Venta del ${fmtDate(DIAV)}</th><th>Faltó / se pasó</th>` : ''}</tr></thead><tbody>`;
  const idx = CFG.brands.map((b, i) => i).filter(i => used.includes(i) || Math.abs(v.real[i]) >= 1 || vis(V1, i) || vis(V2, i));

  h += `</tbody><tfoot><tr><td class="l sticky1">Total</td><td>${fmtMk(v.objT)}</td><td>${fmtMk(v.realT)}</td><td>${pct(v.objT, v.realT)}</td><td>${money(visT(V1))}</td><td>${money(visT(V2))}</td><td>${falta(v.objT, v.realT)}</td><td>${needTag(v.objT, pv.realT == null ? v.realT : pv.realT, true)}</td>${DIAV ? diaCells(diaVend(v)) : ''}</tr></tfoot></table></div>`;
  h += `<p class="note"><b>Última visita</b> y <b>penúltima visita</b>: lo que cargaste hace 7 y 14 días (${dl(V1)} y ${dl(V2)}), por marca y en pesos con impuestos, según la fecha de carga del pedido. Solo cuenta lo que ya está facturado y lo cargado en ${esc(CFG.mes.label)}.</p>`;
  if (SNAP && SNAP.otros && Object.keys(SNAP.otros).length) {
    const o = Object.entries(SNAP.otros).filter(([k,x]) => Math.abs(x) > 1).sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]));
    if (o.length) h += `<p class="note">Facturación que no entra en ninguna marca del concurso: ${o.map(([k,x]) => esc(k) + ' ' + fmtMk(x)).join(' · ')}. No suma a ningún objetivo.</p>`;
  }
  return h;
}

function viewCobertura(){
  const vs = vendFiltered();
  let h = emptyBanner();
  h += howto('Cómo se mide la cobertura Georgalos', [
    '<b>Cliente cubierto</b>: cliente de la cartera del vendedor que en el mes le compró <b>al menos 1 unidad</b> (suelta o display) de la línea, sumando todos sus artículos. Los rechazos restan.',
    '<b>Cobertura general</b>: lo mismo, pero con todos los productos Georgalos juntos (alfajores, galletitas, Flow, Fiestas, etc.).',
    '<b>Clientes a alcanzar</b> = cartera × el % de cada línea (' + GBR.map(g => GSHORT[g] + ' ' + fmtP(CFG.cobObj[g])).join(' · ') + '), redondeado hacia arriba. Ej.: cartera de 260 clientes con 10% → 26 clientes.',
    'Cada línea en la que se llega a esa cantidad suma 1 cupón (C), y la cobertura general suma 1 más: hasta ' + GBR.length + ' cupones por cobertura.',
    'Cada línea tiene su lista de artículos (está en "Cómo funciona"). Si sale un artículo nuevo, hay que agregarlo a la lista.',
    'En la <b>Ficha del vendedor</b> está la lista de clientes que compraron cada marca en septiembre y todavía no en octubre: es la lista para salir a buscar.'
  ]);

  const tot = GBR.map((g,i) => { let n = 0, need = 0, np = 0, ok = 0; for (const v of vs) { n += v.cobCnt[i]; np += Math.max(pvOf(v).cobCnt[i], v.cobCnt[i]); need += v.need[i]; if (v.need[i] && v.cobCnt[i] >= v.need[i]) ok++; } return { n, np, need, ok, p: need ? n / need : null, falta: Math.max(need - n, 0) }; });
  const cartT = vs.reduce((a, v) => a + v.cartera, 0), fN = x => x.toLocaleString('es-AR');
  h += `<div class="cobtags">${GBR.map((g,i) => { const t = tot[i], pc = cartT ? t.n / cartT : 0, po = cartT ? t.need / cartT : 0; return `<div class="kpi cobtag ${cls(t.p)}"><span class="eyebrow">${esc(GSHORT[g])}</span><span class="v">${fmtP(pc)}</span><span class="s muted" style="margin-top:-4px">de la cartera</span><div class="bar" title="Marca negra: objetivo ${fmtP(po)} de la cartera"><i style="width:${Math.min(pc * 100, 100)}%"></i><b style="left:${Math.min(po * 100, 100)}%"></b></div><span class="s"><b>${fN(t.n)}</b> de ${fN(cartT)} clientes de la cartera</span><span class="s">Objetivo ${fmtP(po)} (${fN(t.need)} clientes) · ${t.falta ? '<b>faltan ' + fN(t.falta) + '</b>' : '✓ cumplido'}</span><span class="s muted">${t.p == null ? '' : fmtP(t.p) + ' del objetivo · '}${t.ok} de ${vs.length} vendedores cumplidos${t.np > t.n ? ' · +' + (t.np - t.n) + ' en preventa' : ''}</span></div>`; }).join('')}</div>`;
  const MODES = [['cli','Clientes (cubiertos / a alcanzar)'], ['pct','% de avance'], ['falta','Clientes que faltan']];
  const md = MODES.some(m => m[0] === st.cobMode) ? st.cobMode : 'cli';
  h += `<div class="panel-h"><label class="muted" for="cobMode" style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600">Ver <select id="cobMode">${MODES.map(([k,l]) => `<option value="${k}" ${k===md?'selected':''}>${l}</option>`).join('')}</select></label>${exportBtn('tCob','cobertura_georgalos')}</div>`;
  h += statusLegend();
  h += `<div class="tw"><table id="tCob"><thead><tr><th class="l sticky1">Vendedor</th><th>Cartera</th><th>A alcanzar</th>${GBR.map(g => `<th>${GSHORT[g]}</th>`).join('')}<th>Marcas cubiertas</th></tr></thead><tbody>`;
  const c = (n, need, np) => { const p = need ? n / need : null, f = Math.max(need - n, 0), ok = p >= 1 - 1e-12;
    const main = md === 'pct' ? (p == null ? '—' : (ok ? '✓ ' : '') + fmtP(p)) : md === 'falta' ? (!need ? '—' : ok ? '✓ cumplido' : 'faltan ' + f) : (ok ? '✓ ' : '') + n + ' / ' + need;
    const sub = md === 'cli' ? (p < 1 ? '<br>' + needTag(need, np, false) : '') : md === 'pct' ? `<br><span class="muted" style="font-size:12px">${n} / ${need}</span>` : (p < 1 && need ? '<br>' + needTag(need, np, false) : '');
    return `<span class="cell ${cls(p)}">${main}</span>${np > n ? '<br><span class="muted" style="font-size:12px">+' + (np - n) + ' preventa</span>' : ''}${sub}`; };
  for (const v of vs) h += `<tr class="click" data-ven="${v.cod}"><td class="l name sticky1">${esc(titleCase(v.nom))}</td><td>${v.cartera}</td><td>${v.need[0]}</td>${GBR.map((g,i) => `<td>${c(v.cobCnt[i], v.need[i], pvOf(v).cobCnt[i])}</td>`).join('')}<td class="tot">${v.nCob}</td></tr>`;

  h += '</table></div>';
  return h;
}

  });
  h += '</div></div>';

/* ===================== Batalla Georgalos ===================== */
const DIAS = {1:'Lunes',2:'Martes',3:'Miércoles',4:'Jueves',5:'Viernes',6:'Sábado'};
/* Venta de las últimas visitas: con un día de visita elegido, lo que compró cada cliente (todas las marcas menos Pepsico, por fecha de carga del pedido) en la última visita (el último de ese día antes de hoy) y en la anterior (7 días antes) */
function visitasDe(k){ if (!(+k >= 1 && +k <= 5)) return null; const hoy = (SNAP && SNAP.hoy) || HOYAR; const t = Date.parse(hoy + 'T12:00:00Z'); for (let i = 1; i <= 7; i++) { const d = new Date(t - i * 864e5); if (d.getUTCDay() === +k) return [d.toISOString().slice(0, 10), new Date(t - (i + 7) * 864e5).toISOString().slice(0, 10)]; } return null; }
const VINI = CFG.mes.y + '-' + pad2(CFG.mes.m) + '-01';
const fmtV = n => { const a = Math.abs(n); if (a >= 1e6) return '$ ' + (n / 1e6).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' M'; if (a >= 1e3) return '$ ' + Math.round(n / 1e3).toLocaleString('es-AR') + ' mil'; return '$ ' + Math.round(n).toLocaleString('es-AR'); };
function ventaVis(cod, cli, f){ if (f < VINI) return '<td class="muted" title="Fuera del mes: el tablero toma solo lo cargado en ' + esc(CFG.mes.label) + '">—</td>'; const n = ((((SNAP && SNAP.cd) || {})[cod] || {})[String(cli)] || {})[f] || 0; return n ? `<td class="tot" style="font-size:15px">${fmtV(n)}</td>` : '<td><span class="cell bad" style="min-width:0">sin compra</span></td>'; }
const visTh = VV => VV ? `<th title="Lo que compró el cliente en esa visita (todas las marcas menos Pepsico)">Venta ${fmtDate2(VV[0])}</th><th title="Visita anterior">Venta ${fmtDate2(VV[1])}</th>` : '';
function fmtDate2(f){ return f.slice(8, 10) + '/' + f.slice(5, 7); }
function viewBatalla(){
  const vSel = st.bVen || 'todos', dSel = st.bDia || 'todos', solo = st.bSolo || 'todos';
  const pool = R.vs.filter(v => vSel === 'todos' || String(v.cod) === String(vSel));

function parseObjetivos(sheets){
  const bm = {}; CFG.brands.forEach((b,i) => { bm[norm(b.full)] = i; bm[norm(b.short)] = i; });
  const codSet = new Set(CFG.vend.map(v => v.cod)); const byName = {}; CFG.vend.forEach(v => byName[norm(v.nom)] = v.cod);
  let best = null;
  for (const rows of sheets) {
    for (let i = 0; i < rows.length; i++) {
      const r = (rows[i] || []).map(norm);
      const bcols = []; r.forEach((c,j) => { if (bm[c] != null) bcols.push([j, bm[c]]); });
      if (bcols.length < 3) continue;
      const codC = r.findIndex(c => c === 'CÓD.' || c === 'COD.' || c === 'CÓD' || c === 'COD' || c === 'CODIGO' || c === 'CÓDIGO' || c === 'CODVENDEDOR');
      const nomC = r.findIndex(c => c === 'VENDEDOR');
      if (codC < 0 && nomC < 0) continue;
      let prio = 1;
      for (let k = Math.max(0, i - 3); k < i; k++) { const f = norm((rows[k] || []).find(x => x != null && String(x).trim() !== '')); if (/^4\s*[—-]/.test(f)) prio = 3; else if (/^5\s*[—-]/.test(f) && prio < 2) prio = 2; }
      const vend = {}; let n = 0;
      for (let k = i + 1; k < rows.length; k++) {
        const row = rows[k] || [];
        let cod = codC >= 0 ? Math.round(toNum(row[codC])) : null;
        if (!codSet.has(cod) && nomC >= 0) cod = byName[norm(row[nomC])];
        if (row.slice(0, 4).some(x => norm(x) === 'TOTAL') || /^\d+\s*[—-]/.test(norm(row[0]))) break;
        if (!codSet.has(cod)) continue;
        const o = new Array(CFG.brands.length).fill(0); bcols.forEach(([j, bi]) => o[bi] = Math.round(toNum(row[j]) * 100) / 100);
        vend[cod] = o; n++;
      }
      if (n && (!best || prio > best.prio || (prio === best.prio && n > best.n))) best = { vend, n, prio };
    }
  }
  if (!best) throw new Error('No encontré una tabla de objetivos. Tiene que tener una fila de encabezado con "Cód." o "Vendedor" y columnas con los nombres de las marcas.');
  return best;
}
async function handleObjFile(file){
  modal(`<h3><span class="spinner"></span> Leyendo objetivos de ${esc(file.name)}</h3><p class="ink2" id="prog">Abriendo el archivo…</p>`);
  try {
    await loadXLSX(); await tick();
    const buf = await file.arrayBuffer();
    const names = XLSX.read(new Uint8Array(buf), { type: 'array', bookSheets: true }).SheetNames;
    const pick = names.filter(n => !/ventas|detallado|base clientes/i.test(n));
    const wb = XLSX.read(new Uint8Array(buf), { type: 'array', sheets: pick, dense: true });
    const sheets = pick.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }));
    const res = parseObjetivos(sheets);
    const vend = Object.assign({}, (OBJ && OBJ.vend) || {}, res.vend);
    const doc = { vend, fuente: file.name, cuando: new Date().toISOString(), cobObj: (OBJ && OBJ.cobObj) || null };
    const faltan = CFG.vend.filter(v => !res.vend[v.cod]).map(v => titleCase(v.nom));
    const db = await cuse('db'); let saved = false;
    if (db) { try { await db.doc(ODOC).set(doc); saved = true; } catch (e) {} }
    OBJ = doc; applyObj(); render();
    modal(`<h3>Objetivos cargados</h3><p class="ink2">${res.n} vendedores tomados de ${esc(file.name)}.${faltan.length ? ' Sin cambios (no estaban en el archivo): ' + esc(faltan.join(', ')) + '.' : ''}</p><p class="ink2">${saved ? 'Quedaron guardados para todos.' : 'Se ven solo en esta pantalla: no se pudieron guardar (hace falta permiso de edición).'}</p><div><button class="btn primary" type="button" data-action="close">Listo</button></div>`);
  } catch (err) {
    modal(`<h3>No se pudieron leer los objetivos</h3><p class="ink2">${esc(err.message || err)}</p><div><button class="btn" type="button" data-action="close">Cerrar</button></div>`);
  }
}

  const totO = rows.reduce((a,r) => a + r.o, 0), totC = rows.reduce((a,r) => a + r.cj, 0), totExc = rows.reduce((a,r) => a + r.exc, 0);

const ANW = [
  { k: 'venta', l: 'Venta total vs. ritmo', w: 30 },
  { k: 'marcas', l: 'Marcas en ritmo', w: 20 },
  { k: 'geo', l: 'Cobertura Georgalos', w: 15 },
  { k: 'cart', l: 'Cartera activa', w: 15 },

  { k: 'tost', l: 'Tostadas Ala', w: 10 }

function analStats(){
  const esp = Math.max(R.esperado || 0, 1e-9), CD = (SNAP && SNAP.cd) || {}, T = CFG.tost, TQ = (SNAP && SNAP.tost) || {};
  let ritmoT = esp;
  if (T) { const hab = d => { const w = new Date(d + 'T12:00:00Z').getUTCDay(); return w > 0 && w < 6 && !(T.feriados || []).includes(d); }; const ds = []; for (let t = Date.parse(T.desde + 'T12:00:00Z'); t <= Date.parse(T.hasta + 'T12:00:00Z'); t += 864e5) { const d = new Date(t).toISOString().slice(0, 10); if (hab(d)) ds.push(d); } const hoyT = (SNAP && SNAP.hoy) || HOYAR; ritmoT = ds.length ? Math.max(ds.filter(d => d <= hoyT).length / ds.length, 1e-9) : 1; }

    const ib = v.obj.map((o, i) => o > 0 ? i : -1).filter(i => i >= 0);
    const idxB = ib.map(i => ({ i, o: v.obj[i], r: v.real[i], p: v.real[i] / v.obj[i], g: v.real[i] / v.obj[i] / esp }));

    const cobP = (v.cobPct || []).filter(p => p != null), geoIdx = cobP.length ? cobP.reduce((a, p) => a + Math.min(p / esp, 1.25), 0) / cobP.length : null;
    const cart = (CFG.cart[v.nom] || []).map(String), mine = CD[v.cod] || {}, act = cart.filter(k => mine[k] && Object.values(mine[k]).some(x => x > 0)).length, cartP = cart.length ? act / cart.length : null;
    const pl = v.plan || {}, planR = pl.jugadas ? pl.pts / pl.jugadas : null;

      plan: { val: planR, txt: planR == null ? 'sin datos' : pl.pts + ' pts de ' + pl.jugadas + ' marcas-día (' + fmtP(planR) + ')', pts: planR == null ? 0 : planR },
      tost: { val: tIdx, txt: T ? fmtN(tu) + ' de ' + fmtN(T.obj) + ' u. · ' + fmtP(tIdx) + ' del ritmo' : '—', pts: T ? cap(tIdx) : 0 }

  tip.innerHTML = `<b>${fmtDate(p[2])}</b> · acumulado ${fmtMk(p[1])} · ritmo objetivo ${fmtMk(p[3])}`;
  tip.hidden = false; tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY - 40) + 'px';
});

/* ===================== Exportar ===================== */
async function exportTable(id, name){
  const tbl = document.getElementById(id); if (!tbl) return;
  const lines = [...tbl.querySelectorAll('tr')].map(tr => [...tr.children].map(td => '"' + td.textContent.replace(/^✓$/,'Sí').replace(/^✗$/,'No').replace(/✓\s?/g,'').replace(/\s+/g,' ').trim().replace(/"/g,'""') + '"').join(';'));
  const csv = '﻿' + lines.join('\r\n');
  const dl = await cuse('downloads');
  if (!dl) { toast('La descarga no está disponible en esta vista.'); return; }
  try { await dl.save({ filename: name.replace(/[^\w\-]+/g,'_').toLowerCase() + '_' + CFG.mes.y + '-' + CFG.mes.m + '.csv', data: new Blob([csv], {type:'text/csv'}) }); }
  catch (err) { if (err && err.code !== 'cancelled' && err.code !== 'declined') toast('No se pudo descargar: ' + (err.message || err.code || err)); }
}

/* ===================== Carga de ventas ===================== */
function modal(html){ $('#modal').innerHTML = html; $('#overlay').hidden = false; }
function loadXLSX(){
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar el lector de Excel. Revisá la conexión y probá de nuevo.')); document.head.appendChild(s); });
}
const tick = () => new Promise(r => setTimeout(r, 30));
async function handleFile(file){
  modal(`<h3><span class="spinner"></span> Procesando ${esc(file.name)}</h3><p class="ink2" id="prog">Leyendo el archivo…</p>`);
  const prog = m => { const p = document.getElementById('prog'); if (p) p.textContent = m; };
  try {
    await loadXLSX(); await tick();
    const buf = await file.arrayBuffer();
    prog('Buscando la hoja de ventas…'); await tick();
    let rows;
    if (/\.csv$/i.test(file.name)) {
      let text; try { text = new TextDecoder('utf-8', {fatal:true}).decode(buf); } catch (e) { text = new TextDecoder('windows-1252').decode(buf); }
      const head = text.slice(0, 3000);
      rows = parseCSV(text, head.split(';').length >= head.split(',').length ? ';' : ',');
    } else {
      const names = XLSX.read(new Uint8Array(buf), { type: 'array', bookSheets: true }).SheetNames;
      const pick = names.find(n => /ventas|detallado/i.test(n)) || names[0];
      prog('Leyendo la hoja "' + pick + '" (puede tardar un poco)…'); await tick();
      const wb = XLSX.read(new Uint8Array(buf), { type: 'array', sheets: [pick], dense: true });
      rows = XLSX.utils.sheet_to_json(wb.Sheets[pick], { header: 1, raw: true, defval: null });
    }
    prog('Calculando ' + rows.length.toLocaleString('es-AR') + ' renglones…'); await tick();
    const snap = aggregate(rows, CFG);
    snap.archivo = file.name; snap.cuando = new Date().toISOString(); snap.origen = 'manual';
    snap.hoy = new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Argentina/Buenos_Aires' });
    const user = await cuse('user');
    try { snap.por = user ? await user.id() : null; } catch(e) { snap.por = null; }
    SNAP = snap; render();
    const saved = await saveSnap(snap);
    const tail = snap.nMes ? `${snap.nMes.toLocaleString('es-AR')} renglones de ${CFG.mes.label}, hasta el ${fmtDate(snap.maxM)}.` : `El archivo no tiene ventas de ${CFG.mes.label} (va del ${fmtDate(snap.minD)} al ${fmtDate(snap.maxD)}).`;
    modal(`<h3>${snap.nMes ? 'Ventas cargadas' : 'Revisá el archivo'}</h3><p class="ink2">${tail}${snap.porEntrega ? ' ' + snap.porEntrega.toLocaleString('es-AR') + ' renglones sin fecha de comprobante se tomaron por fecha de entrega.' : ''}</p><p class="ink2">${saved ? 'Quedó guardado: todos los que abran el tablero ven esta carga.' : 'Se ve solo en esta pantalla: no se pudo guardar para el resto (hace falta permiso de edición del tablero).'}</p><div><button class="btn primary" type="button" data-action="close">Listo</button></div>`);
  } catch (err) {
    modal(`<h3>No se pudo procesar el archivo</h3><p class="ink2">${esc(err.message || err)}</p><div><button class="btn" type="button" data-action="close">Cerrar</button></div>`);
  }
}

/* ===================== Datos compartidos ===================== */
const DOC = 'seguimiento/' + CFG.mes.y + '-' + pad2(CFG.mes.m);
const ODOC = 'objetivos/' + CFG.mes.y + '-' + pad2(CFG.mes.m);
let dbRef = null;
async function saveSnap(snap){
  const db = await cuse('db'); if (!db) return false;
  try { await db.doc(DOC).set(snap); return true; } catch (e) { return false; }
}
async function showWho(id){
  const user = await cuse('user'); if (!user) return;
  try { const ps = await user.profiles([id]); const n = ps && ps[id] && ps[id].name; const el = document.getElementById('byWho'); if (el && n) el.textContent = ' por ' + n; } catch (e) {}
}
document.documentElement.classList.add('ro');
const newer = (a, b) => !b || !a || !b.cuando || (a.cuando && a.cuando >= b.cuando);
(async function boot(){
  applyObj(); render();
  cuse('user').then(async u => { try { if (u && await u.canEdit()) document.documentElement.classList.remove('ro'); } catch (e) {} });
  const db = await cuse('db');
  if (!db) return;
  db.doc(DOC).onSnapshot(s => { if (s.exists && newer(s.data(), EMBED)) { SNAP = s.data(); render(); } }, () => {});
  db.doc(ODOC).onSnapshot(s => { if (s.exists && newer(s.data(), EMBED_OBJ)) { OBJ = s.data(); applyObj(); render(); } }, () => {});
})();
</script>
<script>
function geoNombre(c){ return nameOf(c); }
function geoFicha(c){
  const chip = (t, ok, pr) => `<span class="gc${ok ? ' ok' : ''}${pr ? ' pr' : ''}">${ok ? '✓ ' : ''}${esc(t)}</span>`;
  const ord = a => a.sort((x, y) => (x.ok - y.ok) || (y.pr - x.pr));
  const v = R.vs.find(x => (CFG.cart[x.nom] || []).map(String).includes(c)); if (!v) return '';
  let h = `<p class="gmu">${esc(titleCase(v.nom))} · visita ${(DIAS[CFG.dia[c]] || 'sin día').toLowerCase()}</p>`;
  const G = ord(GBR.map((g, i) => ({ t: GSHORT[g], ok: v.cobList[i].includes(c), pr: v.cobCnt[i] < v.need[i] })));
  const fG = G.filter(x => !x.ok).length;
  h += `<div class="gsec"><h4>Georgalos · ${fG ? fG + ' para sumar' : 'todo cubierto'}</h4><p class="gmu">Cubre con 1 unidad de la línea (suelta o display). Con borde: líneas en las que todavía no llegás al cupón.</p><div class="gch">${G.map(x => chip(x.t, x.ok, !x.ok && x.pr)).join('')}</div></div>`;
  const PC = CFG.p10;
  if (PC && PC.sub && PC.sub[c] && SNAP && SNAP.p10) {
    const e = (SNAP.p10[v.cod] || {})[c] || [0, 0, []], set = new Set(e[2] || []), sub = PC.sub[c];
    const st = p10Stats(v.cod);
    const B = ord(PC.brands.map((b, i) => ({ t: b, ok: set.has(i), pr: st.obj[i + 2] > st.real[i + 2] })));
    const fB = B.filter(x => !x.ok).length;
    h += `<div class="gsec"><h4>Peñaflor · ${sub === 'A' ? 'autoservicio' : 'almacén'} · ${fB} marcas para sumar</h4><div class="gch">${chip('CCC del mes', !!e[0], !e[0])}</div><p class="gmu">${esc(PC.reglas[sub])}. Con borde: marcas en las que todavía no llegás al objetivo.</p><div class="gch">${B.map(x => chip(x.t, x.ok, !x.ok && x.pr)).join('')}</div></div>`;
  }
  return h;
}
/* ===== 📍 Estoy en un cliente: ubica al vendedor con el GPS del celular y muestra las oportunidades del cliente más cercano de su cartera ===== */
const GEO = /*GEO_START*/null/*GEO_END*/;
(function(){
  if (!GEO || !Object.keys(GEO).length || !navigator.geolocation) return;
  const E = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const TC = s => String(s || '').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
  const dist = (a, b, c, d) => { const r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r; return Math.sqrt(x * x + y * y) * 6371000; };
  const fmtD = m => m < 1000 ? Math.round(m) + ' m' : (m / 1000).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' km';
  const st = document.createElement('style');
  st.textContent = '#geoBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;border:0;border-radius:999px;padding:13px 18px;font:600 15px var(--f-body,system-ui);background:var(--accent,#2448C7);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}'
    + '#geoOv{position:fixed;inset:0;z-index:80;background:rgba(10,15,22,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}'
    + '#geoOv .gm{background:var(--surface,#fff);color:var(--ink,#15202C);border-radius:14px;width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:18px 18px 20px;display:grid;gap:12px;font:15px/1.45 var(--f-body,system-ui)}'
    + '#geoOv h3{margin:0;font:700 21px var(--f-display,system-ui)} #geoOv h4{margin:6px 0 2px;font:700 16px var(--f-display,system-ui)} #geoOv p{margin:0}'
    + '#geoOv .gmu{color:var(--muted,#738196);font-size:13px} #geoOv .gch{display:flex;flex-wrap:wrap;gap:6px}'
    + '#geoOv .gc{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--bad-bg,#F9DEDB);color:var(--bad,#B4322A)} #geoOv .gc.ok{background:var(--good-bg,#DDF2E4);color:var(--good,#1D7F45)} #geoOv .gc.pr{outline:2px solid var(--bad,#B4322A)}'
    + '#geoOv .gb{border:1px solid var(--line,#D5DCE6);background:var(--surface,#fff);color:inherit;border-radius:10px;padding:10px 12px;text-align:left;font:inherit;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%} #geoOv .gx{border:0;background:var(--surface2,#EAEEF4);color:inherit;border-radius:8px;padding:10px 14px;font:600 14px var(--f-body,system-ui);cursor:pointer}'
    + '#geoOv .gsec{border-top:1px solid var(--line,#D5DCE6);padding-top:10px;display:grid;gap:6px}';
  document.head.appendChild(st);
  const b = document.createElement('button'); b.id = 'geoBtn'; b.type = 'button'; b.textContent = '📍 Estoy en un cliente'; document.body.appendChild(b);
  let ov = null;
  const show = h => { if (!ov) { ov = document.createElement('div'); ov.id = 'geoOv'; ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-gclose]')) { ov.remove(); ov = null; return; } const g = e.target.closest('[data-gcli]'); if (g) ficha(g.dataset.gcli, +g.dataset.gd); }); document.body.appendChild(ov); } ov.innerHTML = '<div class="gm" role="dialog" aria-modal="true">' + h + '</div>'; };
  const cerrar = '<div><button type="button" class="gx" data-gclose>Cerrar</button></div>';
  const nombre = c => TC(window.geoNombre ? geoNombre(c) : '') || 'Cliente ' + c;
  function ficha(c, d){
    let body = '';
    try { body = window.geoFicha ? geoFicha(String(c)) : ''; } catch (e) { body = '<p class="gmu">No se pudo armar el detalle de este cliente.</p>'; }
    show(`<div><h3>${E(nombre(c))}</h3><p class="gmu">Cliente ${E(c)}${d != null && isFinite(d) ? ' · a ' + fmtD(d) : ''}</p></div>${body || '<p class="gmu">Sin oportunidades cargadas para este cliente.</p>'}${cerrar}`);
  }
  b.onclick = () => {
    show('<div><h3>Buscando tu ubicación…</h3><p class="gmu">Si el celular lo pide, permití el acceso a la ubicación.</p></div>' + cerrar);
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude: la, longitude: lo, accuracy: ac } = pos.coords;
      const L = Object.entries(GEO).map(([c, p]) => ({ c, d: dist(la, lo, p[0], p[1]) })).sort((x, y) => x.d - y.d);
      const R = Math.max(120, Math.min(300, (ac || 0) + 60));
      const cerca = L.filter(x => x.d <= R).slice(0, 8);
      if (cerca.length === 1) return ficha(cerca[0].c, cerca[0].d);
      if (cerca.length > 1) return show(`<div><h3>¿En qué cliente estás?</h3><p class="gmu">Hay ${cerca.length} clientes de tu cartera a menos de ${fmtD(R)}.</p></div><div style="display:grid;gap:8px">${cerca.map(x => `<button type="button" class="gb" data-gcli="${E(x.c)}" data-gd="${x.d}"><span><b>${E(nombre(x.c))}</b> <span class="gmu">· ${E(x.c)}</span></span><span class="gmu">${fmtD(x.d)}</span></button>`).join('')}</div>${cerrar}`);
      const n = L.slice(0, 3);
      show(`<div><h3>No hay un cliente tuyo acá</h3><p class="gmu">No encontramos clientes de tu cartera a menos de ${fmtD(R)}${ac ? ' (precisión del GPS: ' + fmtD(ac) + ')' : ''}. Los más cercanos:</p></div><div style="display:grid;gap:8px">${n.map(x => `<button type="button" class="gb" data-gcli="${E(x.c)}" data-gd="${x.d}"><span><b>${E(nombre(x.c))}</b> <span class="gmu">· ${E(x.c)}</span></span><span class="gmu">${fmtD(x.d)}</span></button>`).join('')}</div>${cerrar}`);
    }, err => {
      show(`<div><h3>No pudimos ver tu ubicación</h3><p class="gmu">${err && err.code === 1 ? 'El celular no dio permiso. Activá la ubicación para el navegador y volvé a tocar el botón.' : 'Probá de nuevo al aire libre o con el GPS activado.'}</p></div>${cerrar}`);
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
  };
})();
