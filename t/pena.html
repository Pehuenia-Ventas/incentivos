<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"></head><body><title>Incentivo Peñaflor Pehuenia</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra superior con estado de datos + pestañas; cada pestaña abre con "Cómo se lee" y luego la tabla/tarjetas. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EAEEF4; --line:#D5DCE6; --ink:#15202C; --ink2:#4A5869; --muted:#738196;
  --accent:#2448C7; --accent-soft:#DCE4FB; --accent2:#0E8C8C; --accent2-soft:#D3EFEE;
  --good:#1D7F45; --good-bg:#DDF2E4; --warn:#9A6400; --warn-bg:#FCEFCF; --bad:#B4322A; --bad-bg:#F9DEDB;
  --ticket-empty:#E1E6EE;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151D; --surface:#17202B; --surface2:#1F2A37; --line:#2E3B4B; --ink:#E7ECF3; --ink2:#AFBACA; --muted:#8693A6;
  --accent:#7D9BFF; --accent-soft:#25335E; --accent2:#4CC9C4; --accent2-soft:#173B3D;
  --good:#5FD08C; --good-bg:#173726; --warn:#F0B54A; --warn-bg:#3B2E12; --bad:#FF8A80; --bad-bg:#43201E;
  --ticket-empty:#2A3645; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F151D; --surface:#17202B; --surface2:#1F2A37; --line:#2E3B4B; --ink:#E7ECF3; --ink2:#AFBACA; --muted:#8693A6;
  --accent:#7D9BFF; --accent-soft:#25335E; --accent2:#4CC9C4; --accent2-soft:#173B3D;
  --good:#5FD08C; --good-bg:#173726; --warn:#F0B54A; --warn-bg:#3B2E12; --bad:#FF8A80; --bad-bg:#43201E;
  --ticket-empty:#2A3645; color-scheme:dark;}
[hidden]{display:none!important}
.ro .edit-only{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:34px;font-weight:700;line-height:1.05}
h2{font-size:26px;font-weight:700}
h3{font-size:19px;font-weight:600}
.num,td,th{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Encabezado */
.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
.top .ttl{display:flex;flex-direction:column;gap:4px;min-width:0}
.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.need{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}.need.ok{background:var(--good-bg);color:var(--good)}.need.bad{background:var(--bad-bg);color:var(--bad)}.need.late{background:var(--warn-bg);color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0F151D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0F151D}}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Pestañas */
.tabs{display:flex;gap:4px;overflow-x:auto;margin-block:16px 18px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px;font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.filters label{font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0;max-width:100%}

/* Caja explicativa */
.howto{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 18px;margin-bottom:18px}
.howto summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"▸";color:var(--accent);transition:transform .15s}
.howto[open] summary::before{transform:rotate(90deg)}
.howto ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;max-width:95ch}
.howto p{margin:10px 0 0;max-width:95ch}

/* Tarjetas KPI */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05}
.kpi .s{font-size:13px;color:var(--ink2)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;position:relative;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:1fr}}
.stack{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}

/* Tablas */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--surface);position:sticky;top:0;z-index:1}
th.l,td.l{text-align:left}
tbody tr:hover td{background:var(--surface2)}
tfoot td{font-weight:700;background:var(--surface2)}
td.name{font-weight:600}
tr.click{cursor:pointer}
.sticky1{position:sticky;left:0;background:var(--surface);z-index:2}
tbody tr:hover td.sticky1{background:var(--surface2)}
tfoot td.sticky1{background:var(--surface2)}
th.sticky1{z-index:3}
.cell{display:inline-block;min-width:58px;padding:2px 6px;border-radius:5px;font-weight:600;text-align:center}
.cell.good{background:var(--good-bg);color:var(--good)} .cell.warn{background:var(--warn-bg);color:var(--warn)} .cell.bad{background:var(--bad-bg);color:var(--bad)} .cell.na{color:var(--muted);font-weight:400}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink2);margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}

/* Cupones tipo ticket */
.tickets{display:inline-flex;gap:3px;vertical-align:middle}
.tickets i{width:11px;height:16px;border-radius:2px;background:var(--ticket-empty);display:block}
.tickets i.a{background:var(--accent)} .tickets i.b{background:var(--accent);opacity:.5} .tickets i.c{background:var(--accent2)}
.big-tickets .tickets i{width:22px;height:32px;border-radius:4px}
.tot{font-family:var(--f-display);font-size:20px;font-weight:700}

/* Ficha */
.ficha-head{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;margin-bottom:16px}
.steps{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.step{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.step:last-child{border-bottom:0}
.step .k{font-weight:700}
.step .d{font-size:13px;color:var(--ink2);grid-column:1}
.step .r{grid-row:1 / span 2;grid-column:2;font-family:var(--f-display);font-size:24px;font-weight:700;text-align:right}
.step.total{background:var(--accent-soft)}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
details.cli{border-top:1px solid var(--line);padding:8px 0}
details.cli summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px}
details.cli ol{margin:6px 0 0;padding-left:22px;font-size:13px;columns:2;column-gap:20px}
@media (max-width:560px){details.cli ol{columns:1}}

/* Gráfico */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2}
.chart .area{fill:var(--accent);opacity:.12}
.chart .obj{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:13px;z-index:50;white-space:nowrap}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px;background:var(--surface)}
.empty p{margin:4px 0 0;max-width:70ch;color:var(--ink2)}
.bt-yes{color:var(--good);font-weight:800;font-size:17px}
.bt-no{color:var(--bad);font-weight:800;font-size:17px}
.bt-yes,.bt-no{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:6px}
.bt-yes{background:var(--good-bg)} .bt-no{background:var(--bad-bg)}
.daychips{display:flex;flex-wrap:wrap;gap:6px}
.daychip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;cursor:pointer;font-size:13px}
.daychip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.prose{max-width:80ch}
.prose h3{margin-top:22px}
.prose p,.prose li{color:var(--ink2)}
.prose ol,.prose ul{padding-left:22px;display:grid;gap:6px}
.formula{font-family:var(--f-display);font-size:20px;font-weight:600;background:var(--accent-soft);padding:10px 14px;border-radius:8px;color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.section{margin-top:22px}
.overlay{position:fixed;inset:0;background:rgba(10,15,22,.55);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:22px;max-width:520px;width:100%;display:grid;gap:12px}
.spinner{width:22px;height:22px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
@media (max-width:560px){h1{font-size:28px}.kpi .v{font-size:28px}.wrap{padding-inline:16px}}

    <div class="ttl">
      <span class="eyebrow">Primeros Productos Pehuenia · Peñaflor y P&amp;G · vendedores KAF</span>

<script>
const CFG = /*CFG_START*/null/*CFG_END*/;
/* ===== Núcleo de cálculo · Incentivo Peñaflor (mismo criterio que "Modelo de incentivo Peña Oct 26") ===== */
function norm(s){ return String(s == null ? '' : s).trim().toUpperCase().replace(/\s+/g,' '); }
function pad2(n){ return (n<10?'0':'')+n; }
function toYMD(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number' && isFinite(v)) { if (v < 1000) return null; const d = new Date(Math.round((Math.floor(v) - 25569) * 86400000)); return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate()); }
  if (v instanceof Date && !isNaN(v)) return v.getFullYear()+'-'+pad2(v.getMonth()+1)+'-'+pad2(v.getDate());
  const s = String(v).trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s); if (m) return m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);
  m = /^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/.exec(s); if (m) return m[3]+'-'+pad2(+m[2])+'-'+pad2(+m[1]);
  return null;
}
function toNum(v){
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (v == null || v === '') return 0;
  let s = String(v).trim();
  if (/,\d{1,2}$/.test(s) || (s.includes(',') && s.includes('.') && s.lastIndexOf(',') > s.lastIndexOf('.'))) s = s.replace(/\./g,'').replace(',', '.'); else s = s.replace(/,/g,'');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
}
function parseCSV(t, sep){
  const out=[]; let row=[], f='', q=false, i=0, n=t.length;
  while(i<n){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ f+='"'; i+=2; continue; } q=false; i++; continue; } f+=ch; i++; continue; }
    if(ch==='"' && f===''){ q=true; i++; continue; }
    if(ch===sep){ row.push(f); f=''; i++; continue; }
    if(ch==='\r'){ i++; continue; }
    if(ch==='\n'){ row.push(f); out.push(row); row=[]; f=''; i++; continue; }
    f+=ch; i++; }
  if(f!==''||row.length){ row.push(f); out.push(row); }
  return out;
}
const REQP = ['Cliente','FechaComprobante','FechaEntrega','TipoDeVenta','CodVendedor','Proveedor','Articulo','Linea','RutaPreventa'];

/* Devuelve, por vendedor del concurso, cada cliente con: [día de visita, día del mes de su primera compra Peñaflor del mes (0 = no es CCC), marcas compradas en el mes] */
function aggregateP(rows, C){
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 30); i++) { const r = rows[i] || []; if (r.some(c => norm(c) === 'IMPORTENETOITEM')) { h = i; break; } }
  if (h < 0) throw new Error('No encontré la columna "ImporteNetoItem". Revisá que el archivo sea el "Detallado de ventas".');
  const head = rows[h].map(norm); const ix = {}; const miss = [];
  for (const k of REQP.concat(['RazonSocial'])) { const j = head.indexOf(norm(k)); ix[k] = j; if (j < 0 && REQP.includes(k)) miss.push(k); }
  if (miss.length) throw new Error('Faltan columnas en el archivo: ' + miss.join(', ') + '.');
  const pref = C.mes.y + '-' + pad2(C.mes.m);
  const t0 = new Date(Date.UTC(C.mes.y, C.mes.m - 3, 1)); const trimDesde = t0.getUTCFullYear() + '-' + pad2(t0.getUTCMonth()+1) + '-01';
  const mesFin = pref + '-31';
  const cods = new Set(C.vend.map(v => v.cod));
  const bIdx = {}; C.brands.forEach((b,i) => bIdx[b] = i);
  const art = {}, lin = {}; for (const k in C.mapa.art) art[norm(k)] = C.mapa.art[k]; for (const k in C.mapa.lin) lin[norm(k)] = C.mapa.lin[k];
  const prov = norm(C.proveedor);
  const v = {}; const rutas = {};
  let minD = null, maxD = null, maxM = null, nMes = 0, nTot = 0, porEntrega = 0;
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r) continue;
    const cli0 = r[ix.Cliente]; if (cli0 == null || cli0 === '') continue;
    nTot++;
    const cod = Math.round(toNum(r[ix.CodVendedor])); if (!cods.has(cod)) continue;
    let f = toYMD(r[ix.FechaComprobante]); if (!f) { f = toYMD(r[ix.FechaEntrega]); if (f) porEntrega++; }
    if (!f) continue;
    if (!minD || f < minD) minD = f; if (!maxD || f > maxD) maxD = f;
    if (f < trimDesde || f > mesFin) continue;
    const cli = String(cli0).trim();
    const enMes = f.slice(0,7) === pref;
    const vv = v[cod] = v[cod] || {};
    if (enMes) {
      nMes++; if (!maxM || f > maxM) maxM = f;
      const e = vv[cli] = vv[cli] || [0, 0, []];
      const rt = Math.round(toNum(r[ix.RutaPreventa])); if (rt) { const k = cod + '|' + cli; (rutas[k] = rutas[k] || {})[rt % 10] = (rutas[k][rt % 10] || 0) + 1; }
    }
    if (norm(r[ix.TipoDeVenta]) !== 'VENTA' || norm(r[ix.Proveedor]) !== prov) continue;
    const marca = art[norm(r[ix.Articulo])] || lin[norm(r[ix.Linea])] || null;
    const e = vv[cli] = vv[cli] || [0, 0, []];
    if (enMes) { const d = +f.slice(8,10); if (!e[1] || d < e[1]) e[1] = d; }
    if (marca != null && bIdx[marca] != null && !e[2].includes(bIdx[marca])) e[2].push(bIdx[marca]);
  }
  for (const k in rutas) { const [cod, cli] = k.split('|'); let best = 0, bn = 0; for (const d in rutas[k]) if (rutas[k][d] > bn) { bn = rutas[k][d]; best = +d; } if (v[cod] && v[cod][cli]) v[cod][cli][0] = (best >= 1 && best <= 6) ? best : 0; }
  for (const c in v) for (const k in v[c]) v[c][k][2].sort((a,b) => a - b);
  return { mes: pref, trimDesde, minD, maxD, maxM, nMes, nTot, porEntrega, v };
}

/* Puntos y cupones */
function ptsCCC(p, P){ if (p == null || p < P.minCCC - 1e-12) return 0; return Math.min(p, P.tope) * P.ptsCCC; }
function ptsMarca(p, P, nb){ const pb = P.ptsMarcas / nb; if (p == null || p < P.minMarca - 1e-12) return 0; if (p < 1 - 1e-12) return pb * (P.pctMin + (1 - P.pctMin) * (p - P.minMarca) / (1 - P.minMarca)); return Math.min(p, P.tope) * pb; }
function ptsPG(p, pb, P){ if (p == null || p < P.minMarca - 1e-12) return 0; if (p < 1 - 1e-12) return pb * (P.pctMin + (1 - P.pctMin) * (p - P.minMarca) / (1 - P.minMarca)); return Math.min(p, P.tope) * pb; }
function escala(P, red, max){ if (max == null) max = P.ptsCCC + P.ptsMarcas + P.bonus; return P.escala.map(([pct, cup], i) => ({ nivel: i + 1, pct: pct - (red || 0), desde: (pct - (red || 0)) * max, cup })); }
function cuponesDe(total, esc){ let r = { nivel: 0, cup: 0, desde: 0 }; for (const e of esc) if (total >= e.desde - 1e-9) r = e; const next = esc.find(e => total < e.desde - 1e-9) || null; return { nivel: r.nivel, cup: r.cup, next }; }
function puntuar(obj, real, P){
  const nb = obj.length - 1;
  const pct = obj.map((o,i) => o > 0 ? real[i] / o : null);
  const pC = ptsCCC(pct[0], P);
  const pM = pct.slice(1).map(p => ptsMarca(p, P, nb));
  const pleno = pct[0] != null && pct[0] >= 1 - 1e-12 && pct.slice(1).every(p => p != null && p >= 1 - 1e-12);
  const bonus = pleno ? P.bonus : 0;
  const ptsMarcas = pM.reduce((a,b) => a + b, 0);
  return { pct, pC, pM, ptsMarcas, bonus, pleno, total: pC + ptsMarcas + bonus };

/* P&G: cobertura (clientes de la cartera con al menos un producto P&G en el mes) y sell out en pesos contra septiembre +5% */
function pgPts(cobR, cobO, soR, soO, CFG){
  const G = CFG.pg, P = CFG.params;
  const pCob = cobO > 0 ? cobR / cobO : null, pSo = soO > 0 ? soR / soO : null;
  const ptsCob = ptsPG(pCob, G.pts.cob, P), ptsSo = ptsPG(pSo, G.pts.so, P);

}
function pgDe(CFG, SNAP, cod){
  const G = CFG.pg; if (!G) return { on: false, cobR: 0, cobO: 0, soR: 0, soO: 0, sep: 0, pCob: null, pSo: null, ptsCob: 0, ptsSo: 0, pts: 0, max: 0, cli: {} };
  const o = (G.vend || {})[cod] || {}; const sp = (SNAP && SNAP.pg) || {}; const cli = (sp.c && sp.c[cod]) || {};
  const g = pgPts(Object.keys(cli).length, o.cob || 0, Math.round((sp.so && sp.so[cod]) || 0), o.so || 0, CFG);

function computeP(CFG, SNAP){
  const P = CFG.params, nb = CFG.brands.length;
  const hab = CFG.habiles;
  let lastD = SNAP && SNAP.maxM ? SNAP.maxM : null; if (lastD && SNAP.hoy && SNAP.hoy < lastD) lastD = SNAP.hoy;
  const diasTrans = lastD ? hab.filter(d => d <= lastD).length : 0, diasTot = hab.length;
  const esperado = diasTot ? diasTrans / diasTot : 0;
  const maxPG = CFG.pg ? CFG.pg.pts.cob + CFG.pg.pts.so : 0;
  const max = P.ptsCCC + P.ptsMarcas + P.bonus + maxPG;
  const escV = escala(P, 0, max), escS = escala(P, P.redSup, max);
  const vs = CFG.vend.map(v => {
    const base = CFG.base[v.cod] || {}; const snap = (SNAP && SNAP.v && SNAP.v[v.cod]) || {};
    const ids = [...new Set(Object.keys(base).concat(Object.keys(snap)))];
    const clientes = ids.map(c => {
      const b = base[c] || [0, []], s = snap[c] || [0, 0, []];
      const mes = new Set(s[2]); const all = new Set(b[1].concat(s[2]));
      return { c, dia: s[0] || b[0] || 0, ccc: s[1] || 0, has: CFG.brands.map((x,i) => all.has(i)), mes: CFG.brands.map((x,i) => mes.has(i)), nuevo: !base[c] };
    });
    const real = [clientes.filter(x => x.ccc).length].concat(CFG.brands.map((x,i) => clientes.filter(k => k.has[i]).length));
    const p = puntuar(v.obj, real, P);
    const pg = pgDe(CFG, SNAP, v.cod);
    const vmax = v.soloPG ? maxPG : max;
    const esc = v.soloPG ? escala(P, 0, vmax) : escV;
    const total = p.total + pg.pts;
    const cu = cuponesDe(total, esc);

    const mine = vs.filter(v => v.sup === s);
    const obj = CFG.vend[0].obj.map((x,i) => mine.reduce((a,v) => a + (v.obj[i] || 0), 0));
    const real = obj.map((x,i) => mine.reduce((a,v) => a + v.real[i], 0));
    const p = puntuar(obj, real, P);
    const pg = CFG.pg ? pgPts(mine.reduce((a,v) => a + v.pg.cobR, 0), mine.reduce((a,v) => a + v.pg.cobO, 0), mine.reduce((a,v) => a + v.pg.soR, 0), mine.reduce((a,v) => a + v.pg.soO, 0), CFG) : { on: false, pts: 0, max: 0 };
    const total = p.total + pg.pts;
    const cu = cuponesDe(total, escS);

  });
  const sumS = sups.reduce((a,s) => a + s.cup, 0);

function parseObjetivos(sheets){
  const cm = {}; COLS.forEach((c,i) => cm[norm(c)] = i);
  const codSet = new Set(CFG.vend.map(v => v.cod));
  let best = null;
  for (const rows of sheets) for (let i = 0; i < rows.length; i++) {
    const r = (rows[i] || []).map(norm); const cols = []; r.forEach((c,j) => { if (cm[c] != null) cols.push([j, cm[c]]); });
    if (cols.length < 6) continue;
    const codC = r.findIndex(c => ['CÓD.','COD.','CÓD','COD','CODIGO','CÓDIGO','CODVENDEDOR'].includes(c)); if (codC < 0) continue;
    const vend = {}; let n = 0;
    for (let k = i + 1; k < rows.length; k++) { const row = rows[k] || []; if (row.slice(0,4).some(x => norm(x) === 'TOTAL')) break; const cod = Math.round(toNum(row[codC])); if (!codSet.has(cod)) continue; const o = new Array(COLS.length).fill(0); cols.forEach(([j, ci]) => o[ci] = Math.round(toNum(row[j]))); vend[cod] = o; n++; }
    if (n && (!best || n > best.n)) best = { vend, n };
  }
  if (!best) throw new Error('No encontré la tabla de objetivos. Tiene que tener una fila con "Cód.", "CCC" y los nombres de las marcas.');
  return best;
}
function loadXLSX(){ if (window.XLSX) return Promise.resolve(); return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar el lector de Excel. Revisá la conexión y probá de nuevo.')); document.head.appendChild(s); }); }
const tick = () => new Promise(r => setTimeout(r, 30));
async function handleObjFile(file){
  modal(`<h3><span class="spinner"></span> Leyendo objetivos de ${esc(file.name)}</h3>`);

    const wb = XLSX.read(new Uint8Array(buf), { type: 'array', sheets: names, dense: true });

      const { latitude: la, longitude: lo, accuracy: ac } = pos.coords;
      const L = Object.entries(GEO).map(([c, p]) => ({ c, d: dist(la, lo, p[0], p[1]) })).sort((x, y) => x.d - y.d);
      const R = Math.max(120, Math.min(300, (ac || 0) + 60));
      const cerca = L.filter(x => x.d <= R).slice(0, 8);
      if (cerca.length === 1) return ficha(cerca[0].c, cerca[0].d);
      if (cerca.length > 1) return show(`<div><h3>¿En qué cliente estás?</h3><p class="gmu">Hay ${cerca.length} clientes de tu cartera a menos de ${fmtD(R)}.</p></div><div style="display:grid;gap:8px">${cerca.map(x => `<button type="button" class="gb" data-gcli="${E(x.c)}" data-gd="${x.d}"><span><b>${E(nombre(x.c))}</b> <span class="gmu">· ${E(x.c)}</span></span><span class="gmu">${fmtD(x.d)}</span></button>`).join('')}</div>${cerrar}`);
      const n = L.slice(0, 3);
      show(`<div><h3>No hay un cliente tuyo acá</h3><p class="gmu">No encontramos clientes de tu cartera a menos de ${fmtD(R)}${ac ? ' (precisión del GPS: ' + fmtD(ac) + ')' : ''}. Los más cercanos:</p></div><div style="display:grid;gap:8px">${n.map(x => `<button type="button" class="gb" data-gcli="${E(x.c)}" data-gd="${x.d}"><span><b>${E(nombre(x.c))}</b> <span class="gmu">· ${E(x.c)}</span></span><span class="gmu">${fmtD(x.d)}</span></button>`).join('')}</div>${cerrar}`);
    }, err => {
      show(`<div><h3>No pudimos ver tu ubicación</h3><p class="gmu">${err && err.code === 1 ? 'El celular no dio permiso. Activá la ubicación para el navegador y volvé a tocar el botón.' : 'Probá de nuevo al aire libre o con el GPS activado.'}</p></div>${cerrar}`);
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
  };
})();
</script>
</body></html>
