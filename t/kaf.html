<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Facturación KAF por marca</title>
<style>
/* Layout: barra superior con estado de datos + pestañas; cada pestaña abre con "Cómo se lee" y luego la tabla/tarjetas. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EAEEF4; --line:#D5DCE6; --ink:#15202C; --ink2:#4A5869; --muted:#738196;
  --accent:#2448C7; --accent-soft:#DCE4FB; --accent2:#0E8C8C; --accent2-soft:#D3EFEE;
  --good:#1D7F45; --good-bg:#DDF2E4; --warn:#9A6400; --warn-bg:#FCEFCF; --bad:#B4322A; --bad-bg:#F9DEDB;
  --ticket-empty:#E1E6EE;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151D; --surface:#17202B; --surface2:#1F2A37; --line:#2E3B4B; --ink:#E7ECF3; --ink2:#AFBACA; --muted:#8693A6;
  --accent:#7D9BFF; --accent-soft:#25335E; --accent2:#4CC9C4; --accent2-soft:#173B3D;
  --good:#5FD08C; --good-bg:#173726; --warn:#F0B54A; --warn-bg:#3B2E12; --bad:#FF8A80; --bad-bg:#43201E;
  --ticket-empty:#2A3645; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F151D; --surface:#17202B; --surface2:#1F2A37; --line:#2E3B4B; --ink:#E7ECF3; --ink2:#AFBACA; --muted:#8693A6;
  --accent:#7D9BFF; --accent-soft:#25335E; --accent2:#4CC9C4; --accent2-soft:#173B3D;
  --good:#5FD08C; --good-bg:#173726; --warn:#F0B54A; --warn-bg:#3B2E12; --bad:#FF8A80; --bad-bg:#43201E;
  --ticket-empty:#2A3645; color-scheme:dark;}
[hidden]{display:none!important}
.ro .edit-only{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:34px;font-weight:700;line-height:1.05}
h2{font-size:26px;font-weight:700}
h3{font-size:19px;font-weight:600}
.num,td,th{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Encabezado */
.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
.top .ttl{display:flex;flex-direction:column;gap:4px;min-width:0}
.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.need{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}.need.ok{background:var(--good-bg);color:var(--good)}.need.bad{background:var(--bad-bg);color:var(--bad)}.need.late{background:var(--warn-bg);color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0F151D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0F151D}}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Pestañas */
.tabs{display:flex;gap:4px;overflow-x:auto;margin-block:16px 18px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px;font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.filters label{font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0;max-width:100%}

/* Caja explicativa */
.howto{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 18px;margin-bottom:18px}
.howto summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"▸";color:var(--accent);transition:transform .15s}
.howto[open] summary::before{transform:rotate(90deg)}
.howto ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;max-width:95ch}
.howto p{margin:10px 0 0;max-width:95ch}

/* Tarjetas KPI */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05}
.kpi .s{font-size:13px;color:var(--ink2)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;position:relative;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:1fr}}
.stack{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}

/* Tablas (las listas largas scrollean dentro de la tabla, máx. 75% de la pantalla, así los títulos de columna quedan fijos) */
.tw{overflow:auto;max-height:75vh;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--surface);position:sticky;top:0;z-index:1}
th.l,td.l{text-align:left}
tbody tr:hover td{background:var(--surface2)}
tfoot td{font-weight:700;background:var(--surface2)}
td.name{font-weight:600}
tr.click{cursor:pointer}
.sticky1{position:sticky;left:0;background:var(--surface);z-index:2}
tbody tr:hover td.sticky1{background:var(--surface2)}
tfoot td.sticky1{background:var(--surface2)}
th.sticky1{z-index:3}
.cell{display:inline-block;min-width:58px;padding:2px 6px;border-radius:5px;font-weight:600;text-align:center}
.cell.good{background:var(--good-bg);color:var(--good)} .cell.warn{background:var(--warn-bg);color:var(--warn)} .cell.bad{background:var(--bad-bg);color:var(--bad)} .cell.na{color:var(--muted);font-weight:400}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink2);margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}

/* Cupones tipo ticket */
.tickets{display:inline-flex;gap:3px;vertical-align:middle}
.tickets i{width:11px;height:16px;border-radius:2px;background:var(--ticket-empty);display:block}
.tickets i.a{background:var(--accent)} .tickets i.b{background:var(--accent);opacity:.5} .tickets i.c{background:var(--accent2)}
.big-tickets .tickets i{width:22px;height:32px;border-radius:4px}
.tot{font-family:var(--f-display);font-size:20px;font-weight:700}

/* Ficha */
.ficha-head{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;margin-bottom:16px}
.steps{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.step{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.step:last-child{border-bottom:0}
.step .k{font-weight:700}
.step .d{font-size:13px;color:var(--ink2);grid-column:1}
.step .r{grid-row:1 / span 2;grid-column:2;font-family:var(--f-display);font-size:24px;font-weight:700;text-align:right}
.step.total{background:var(--accent-soft)}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
details.cli{border-top:1px solid var(--line);padding:8px 0}
details.cli summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px}
details.cli ol{margin:6px 0 0;padding-left:22px;font-size:13px;columns:2;column-gap:20px}
@media (max-width:560px){details.cli ol{columns:1}}

/* Gráfico */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2}
.chart .area{fill:var(--accent);opacity:.12}
.chart .obj{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:13px;z-index:50;white-space:nowrap}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px;background:var(--surface)}
.empty p{margin:4px 0 0;max-width:70ch;color:var(--ink2)}
.bt-yes{color:var(--good);font-weight:800;font-size:17px}
.bt-no{color:var(--bad);font-weight:800;font-size:17px}
.bt-yes,.bt-no{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:6px}
.bt-yes{background:var(--good-bg)} .bt-no{background:var(--bad-bg)}
.daychips{display:flex;flex-wrap:wrap;gap:6px}
.daychip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;cursor:pointer;font-size:13px}
.daychip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.prose{max-width:80ch}
.prose h3{margin-top:22px}
.prose p,.prose li{color:var(--ink2)}
.prose ol,.prose ul{padding-left:22px;display:grid;gap:6px}
.formula{font-family:var(--f-display);font-size:20px;font-weight:600;background:var(--accent-soft);padding:10px 14px;border-radius:8px;color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.section{margin-top:22px}
.overlay{position:fixed;inset:0;background:rgba(10,15,22,.55);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:22px;max-width:520px;width:100%;display:grid;gap:12px}
.spinner{width:22px;height:22px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
@media (max-width:560px){h1{font-size:28px}.kpi .v{font-size:28px}.wrap{padding-inline:16px}}
</style>
<style>
.dfil{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-bottom:12px}
.dfil label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.dfil input[type=date],.dfil select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:36px}
td.zero{color:var(--muted)}
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <div class="ttl">
      <span class="eyebrow">Primeros Productos Pehuenia · vendedores KAF 24 a 28</span>
      <h1>Facturación por marca · <span id="mesLabel"></span></h1>
    </div>
    <div class="status"><span id="stData" class="chip"></span></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<script>
const CFG = /*CFG_START*/null/*CFG_END*/;
const EMBED = /*EMBED_START*/null/*EMBED_END*/;
const EMBED_OBJ = /*EMBEDOBJ_START*/null/*EMBEDOBJ_END*/;
const S = EMBED || { provs: [], d: {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtM = n => '$' + Math.round(n || 0).toLocaleString('es-AR');
const titleCase = s => String(s).toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
const DIAS = {1:'Lunes',2:'Martes',3:'Miércoles',4:'Jueves',5:'Viernes',6:'Sábado'};
const dow = f => new Date(f + 'T12:00:00').getDay(); // 0 domingo
const fechas = Object.keys(S.d).sort();
const pad2 = n => (n < 10 ? '0' : '') + n;
const ini = CFG.mes.y + '-' + pad2(CFG.mes.m) + '-01', fin = fechas.length ? fechas[fechas.length - 1] : ini;
const st = { desde: ini, hasta: fin, dias: [], ven: 'todos', orden: 'total', tab: 'fact' };
try { Object.assign(st, JSON.parse(localStorage.getItem('kfac_ui') || '{}')); } catch (e) {}
if (st.desde < ini) st.desde = ini; if (st.hasta > fin || st.hasta < ini) st.hasta = fin;
const save = () => { try { localStorage.setItem('kfac_ui', JSON.stringify(st)); } catch (e) {} };
const fD = f => f ? f.slice(8, 10) + '/' + f.slice(5, 7) : '—';
document.getElementById('mesLabel').textContent = CFG.mes.label;
document.getElementById('stData').textContent = 'Ventas hasta el ' + fD(S.maxF) + (S.cuando ? ' · actualizado ' + new Date(S.cuando).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '');
const vend = CFG.vend.slice().sort((a, b) => a.cod - b.cod);
/* Objetivo diario del equipo KAF: se reparte por marca y vendedor según el peso de cada uno en la facturación del mes hasta hoy */
const OBJ = (function(){
  const mes = {}; for (const f of fechas) for (const v of vend) { const e = (S.d[f] || {})[v.cod] || {}; for (const k in e) { mes[v.cod] = mes[v.cod] || {}; mes[v.cod][k] = (mes[v.cod][k] || 0) + e[k]; } }
  let pos = 0; for (const c in mes) for (const k in mes[c]) if (mes[c][k] > 0) pos += mes[c][k];
  const wT = (c, k) => pos > 0 && mes[c] && mes[c][k] > 0 ? mes[c][k] / pos : 0;
  /* Si vienen objetivos por vendedor (objV, del mes): cada vendedor lleva su objetivo y se reparte entre las marcas según el peso de cada marca en el total facturado por el equipo */
  const OV = CFG.objV || null, sOV = OV ? Object.values(OV).reduce((a, b) => a + b, 0) : 0;
  const posV = {}, posB = {}; for (const c in mes) for (const k in mes[c]) if (mes[c][k] > 0) { posV[c] = (posV[c] || 0) + mes[c][k]; posB[k] = (posB[k] || 0) + mes[c][k]; }
  const w0 = !sOV ? wT : (c, k) => { const ov = OV[c] || 0; if (!ov) return 0; const sh = pos > 0 ? (posB[k] || 0) / pos : 0; return ov / sOV * sh; }; /* peso de cada marca sobre el total del equipo (pedido 3/11) */
  /* P&G (New PGA) con su objetivo trimestral (CFG.objPG, objetivo del mes en pesos): reemplaza la parte de New PGA; el resto de las marcas queda igual */
  const SOk = CFG.shortOf || {}, kPG = S.provs.findIndex(p => SOk[String(p).trim().toUpperCase().replace(/\s+/g, ' ')] === 'New PGA'), OPG = CFG.objPG || null;
  const sOV2 = sOV && OPG && kPG >= 0 ? sOV - vend.reduce((a, v) => a + w0(String(v.cod), kPG) * sOV, 0) + vend.reduce((a, v) => a + (OPG[v.cod] || 0), 0) : sOV;
  const w = !(sOV && OPG && kPG >= 0) ? w0 : (c, k) => k === kPG ? (OPG[c] || 0) / sOV2 : w0(c, k) * sOV / sOV2;
  const H = (CFG.habiles || []).filter(f => f.startsWith(ini.slice(0, 7))), hoy = S.maxF || fin;
  const DJ = H.length ? H.filter(f => f <= hoy).length : fechas.length, DQ = H.length ? H.filter(f => f > hoy).length : 0, NH = H.length || fechas.length;
  const OD = sOV ? sOV2 / NH : CFG.objMes ? CFG.objMes / NH : (CFG.objDia || 0); if (!OD) return null;
  const hoyS = S.hoy || hoy, ant = H.filter(f => f < hoyS), DIA = ant.length ? ant[ant.length - 1] : null, RESTD = DIA ? H.filter(f => f >= DIA).length : 0;
  const dayV = (c, f) => { const e = (S.d[f] || {})[c] || {}; return Object.values(e).reduce((a, b) => a + b, 0); };
  const antesV = c => fechas.filter(f => DIA && f < DIA).reduce((a, f) => a + dayV(c, f), 0);
  return { OD, mes, w, DJ, DQ, NH, DIA, RESTD, dayV, antesV, sale: (c, k) => (mes[c] || {})[k] || 0 };
})();
/* ===================== Objetivo del día por marca =====================
   Objetivo del día de cada marca: el que cargó el vendedor en el form "Objetivo diario por marca"; si no lo cargó, el automático
   = lo que le faltaba del objetivo del mes en esa marca al empezar el día ÷ días hábiles que quedaban (incluido ese día). */
function odiaView(A){
  /* A: { brands:[{k,name,short}], vend:[{cod,nom}], objMes(cod,k), sale(cod,f,k), fechas:[...], habiles:[...], hoy, form:{cod:{f:{short:monto}}}, st, esc, tc } */
  const st = A.st, esc = A.esc, tc = A.tc, $f = n => '$' + Math.round(n || 0).toLocaleString('es-AR');
  const H = A.habiles.slice().sort(); if (!H.length) return '';
  const hoy = A.hoy, sig = H.find(d => d >= hoy) || H[H.length - 1];
  let dia = st.odDia && H.includes(st.odDia) ? st.odDia : sig;
  const vs = A.vend.filter(v => st.odVen === 'todos' || !st.odVen || String(v.cod) === String(st.odVen));
  const rest = H.filter(d => d >= dia).length;
  const menos = n => new Date(Date.parse(dia + 'T12:00:00Z') - n * 864e5).toISOString().slice(0, 10), V1 = menos(7), V2 = menos(14), VIS = !!A.vis;
  const fF = f => f.slice(8, 10) + '/' + f.slice(5, 7), DN = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'], dn = f => DN[new Date(f + 'T12:00:00').getDay()];
  const one = (cod, k, short) => {
    const om = A.objMes(cod, k) || 0; let antes = 0; for (const f of A.fechas) if (f < dia) antes += A.sale(cod, f, k) || 0;
    const auto = rest ? Math.max(0, om - antes) / rest : 0;
    const fv = ((A.form[cod] || {})[dia] || {})[short];
    const carg = fv != null && fv !== '' && isFinite(+fv);
    return { om, antes, auto, obj: carg ? +fv : auto, carg, venta: A.sale(cod, dia, k) || 0, v1: A.vis ? A.vis(cod, V1, k) || 0 : 0, v2: A.vis ? A.vis(cod, V2, k) || 0 : 0 };
  };
  const rows = A.brands.map(b => { const xs = vs.map(v => one(v.cod, b.k, b.short)); const s = key => xs.reduce((a, x) => a + x[key], 0); return { b, om: s('om'), antes: s('antes'), auto: s('auto'), obj: s('obj'), venta: s('venta'), v1: s('v1'), v2: s('v2'), nC: xs.filter(x => x.carg).length, n: xs.length }; }).filter(r => r.om > 0 || r.obj > 0 || Math.abs(r.venta) >= 1 || r.v1 || r.v2);

  h += `<div class="dfil"><label>Desde<input type="date" id="fDesde" min="${ini}" max="${fin}" value="${st.desde}"></label><label>Hasta<input type="date" id="fHasta" min="${ini}" max="${fin}" value="${st.hasta}"></label><label>Vendedor<select id="fVen"><option value="todos">Todos</option>${vend.map(v => `<option value="${v.cod}" ${String(v.cod) === st.ven ? 'selected' : ''}>${v.cod} · ${esc(titleCase(v.nom))}</option>`).join('')}</select></label><label>Ordenar<select id="fOrd"><option value="total" ${st.orden === 'total' ? 'selected' : ''}>Mayor facturación</option><option value="az" ${st.orden === 'az' ? 'selected' : ''}>Marca A-Z</option></select></label><button class="btn small" type="button" id="fReset">Todo el mes</button></div>`;
  h += `<div class="daychips" role="group" aria-label="Día de la semana" style="margin-bottom:16px"><button type="button" class="daychip" data-dia="todos" aria-pressed="${!st.dias.length}">Todos los días</button>${Object.entries(DIAS).map(([k, l]) => `<button type="button" class="daychip" data-dia="${k}" aria-pressed="${st.dias.includes(k)}">${l}</button>`).join('')}</div>`;
  h += `<div class="kpis"><div class="kpi"><span class="eyebrow">Facturación</span><span class="v">${fmtM(T)}</span><span class="s">${sel.length} días con venta en el filtro · ${fD(st.desde)} al ${fD(st.hasta)}</span></div><div class="kpi"><span class="eyebrow">Marcas con venta</span><span class="v">${conVenta} <span class="muted" style="font-size:20px">/ ${P.length}</span></span><span class="s">de las marcas que vendió la empresa en el mes (sin Pepsico)</span></div><div class="kpi"><span class="eyebrow">Promedio por día</span><span class="v">${fmtM(sel.length ? T / sel.length : 0)}</span><span class="s">facturación ÷ días con venta</span></div></div>`;
  if (OBJ) {
    const O = OBJ, P2 = S.provs.map((p, i) => i), cs = vs.map(v => v.cod);
    const odV = c => P2.reduce((a, k) => a + O.OD * O.w(c, k), 0), odB = (k, cc) => cc.reduce((a, c) => a + O.OD * O.w(c, k), 0);
    const saleV = c => P2.reduce((a, k) => a + O.sale(c, k), 0), saleB = (k, cc) => cc.reduce((a, c) => a + O.sale(c, k), 0);
    const pct = (r, o) => o > 0 ? `<span class="cell ${r >= o - 0.5 ? 'good' : r >= 0.8 * o ? 'warn' : 'bad'}">${Math.floor(100 * r / o + 1e-9).toLocaleString('es-AR', { maximumFractionDigits: 0 })}%</span>` : '<span class="cell na">—</span>';
    const need = (o, r) => { const f = o * O.NH - r; if (f <= 0) return '<span class="need ok">✓ mes cubierto</span>'; if (!O.DQ) return '<span class="need bad">mes cerrado</span>'; return `<span class="need">${fmtM(f / O.DQ)} por día</span>`; };
    const oD = cs.reduce((a, c) => a + odV(c), 0), rM = cs.reduce((a, c) => a + saleV(c), 0);
    const diaC = (ven, objMes, antes, necFijo) => { const nec = necFijo != null ? necFijo : Math.max(0, (objMes - antes) / (O.RESTD || 1)); const ok = necFijo == null && antes >= objMes; const d = ven - nec; return `<td class="tot" title="Necesitaba ${fmtM(nec)} ese día">${fmtM(ven)}</td><td>${ok ? '<span class="cell good">✓ mes cubierto</span>' : `<span class="cell ${d >= 0 ? 'good' : 'bad'}" title="Necesitaba ${fmtM(nec)} ese día">${d >= 0 ? 'se pasó ' + fmtM(d) : 'faltó ' + fmtM(-d)}</span>`}</td>`; };
    h += `<div class="section"><div class="panel-h"><h3>Objetivo ${fmtM(O.OD * O.NH)} en el mes · equipo KAF</h3></div>`;
    h += `<details class="howto"><summary>Cómo se arma el objetivo</summary><ul><li>Objetivo del equipo: <b>${fmtM(O.OD * O.NH)} en el mes</b> entre todos los vendedores KAF y todas las marcas (sin Pepsico). Son ${O.NH} días hábiles: <b>${fmtM(O.OD)} por día</b>.</li>${CFG.objV ? '<li>Cada vendedor tiene su <b>objetivo del mes</b>, y se reparte entre las marcas según el <b>peso de cada marca en el total facturado por el equipo KAF</b> en ' + CFG.mes.label + ' hasta hoy (todos los vendedores con el mismo reparto). El reparto se recalcula en cada actualización.</li>' : '<li>Se reparte por <b>marca y vendedor</b> según el peso de cada uno en la facturación de ' + CFG.mes.label + ' hasta hoy (lo que más se vende, más objetivo lleva). El peso se recalcula en cada actualización.</li>'}<li><b>A la fecha</b>: objetivo diario × ${O.DJ} días hábiles transcurridos. <b>Por día</b>: lo que falta para el objetivo del mes ÷ ${O.DQ} días hábiles que quedan.</li><li>Esta parte toma todo el mes y no cambia con el filtro de fechas o días; sí con el de vendedor.</li>${O.DIA ? '<li><b>Venta del ' + fD(O.DIA) + '</b>: lo facturado ese día (último día hábil completo). <b>Faltó / se pasó</b>: contra lo que necesitaba vender ese día para llegar a su objetivo del mes (lo que le faltaba al empezar el día ÷ los ' + O.RESTD + ' días hábiles que quedaban, incluido ese día).</li>' : ''}</ul></details>`;
    h += `<div class="kpis"><div class="kpi"><span class="eyebrow">Objetivo por día</span><span class="v">${fmtM(oD)}</span><span class="s">${vs.length === 1 ? 'de ' + vs[0].cod + ' · ' + esc(titleCase(vs[0].nom)) : 'equipo KAF'} · ${fmtM(oD * O.NH)} en el mes</span></div><div class="kpi"><span class="eyebrow">Facturado vs objetivo a la fecha</span><span class="v">${pct(rM, oD * O.DJ)}</span><span class="s">${fmtM(rM)} de ${fmtM(oD * O.DJ)} (${O.DJ} días hábiles)</span></div><div class="kpi"><span class="eyebrow">Para cumplir el mes</span><span class="v" style="font-size:22px">${need(oD, rM)}</span><span class="s">${O.DQ} días hábiles por delante</span></div></div>`;
    const rv = vend.map(v => ({ v, o: odV(v.cod), r: saleV(v.cod) }));
    h += `<div class="section"><div class="panel-h"><h3>Cuánto tiene que vender cada vendedor</h3><span style="flex:1"></span><button class="btn small" type="button" data-export="tOv" data-name="objetivo_kaf_vendedores">Exportar a Excel (CSV)</button></div><div class="tw"><table id="tOv"><thead><tr><th class="l sticky1">Vendedor</th><th>Peso</th><th>Objetivo por día</th><th>Objetivo del mes</th><th>Objetivo a la fecha</th><th>Facturado</th>${O.DIA ? `<th>Venta del ${fD(O.DIA)}</th><th>Faltó / se pasó</th>` : ''}<th>Cumplimiento</th><th>Falta para el mes</th><th class="l">De acá a fin de mes</th></tr></thead><tbody>${rv.map(x => `<tr${cs.includes(x.v.cod) || vs.length !== 1 ? '' : ' style="opacity:.5"'}><td class="l sticky1 name">${x.v.cod} · ${esc(titleCase(x.v.nom))}</td><td class="ink2">${(100 * x.o / O.OD).toLocaleString('es-AR', { maximumFractionDigits: 1 })}%</td><td class="tot">${fmtM(x.o)}</td><td>${fmtM(x.o * O.NH)}</td><td>${fmtM(x.o * O.DJ)}</td><td>${fmtM(x.r)}</td>${O.DIA ? diaC(O.dayV(x.v.cod, O.DIA), x.o * O.NH, O.antesV(x.v.cod)) : ''}<td>${pct(x.r, x.o * O.DJ)}</td><td>${fmtM(Math.max(0, x.o * O.NH - x.r))}</td><td class="l">${need(x.o, x.r)}</td></tr>`).join('')}</tbody><tfoot><tr><td class="l sticky1">Equipo</td><td>100%</td><td>${fmtM(O.OD)}</td><td>${fmtM(O.OD * O.NH)}</td><td>${fmtM(O.OD * O.DJ)}</td><td>${fmtM(rv.reduce((a, x) => a + x.r, 0))}</td>${O.DIA ? (function(){ const ven = rv.reduce((a, x) => a + O.dayV(x.v.cod, O.DIA), 0), nec = rv.reduce((a, x) => a + Math.max(0, (x.o * O.NH - O.antesV(x.v.cod)) / (O.RESTD || 1)), 0); return diaC(ven, null, null, nec); })() : ''}<td>${pct(rv.reduce((a, x) => a + x.r, 0), O.OD * O.DJ)}</td><td>${fmtM(Math.max(0, O.OD * O.NH - rv.reduce((a, x) => a + x.r, 0)))}</td><td class="l">${need(O.OD, rv.reduce((a, x) => a + x.r, 0))}</td></tr></tfoot></table></div></div>`;
    const rb = P2.map(k => ({ k, o: odB(k, cs), r: saleB(k, cs) })).filter(x => x.o > 0 || Math.abs(x.r) >= 1).sort((a, b) => b.o - a.o);
    h += `<div class="section"><div class="panel-h"><h3>Objetivo por marca${vs.length === 1 ? ' · ' + vs[0].cod + ' · ' + esc(titleCase(vs[0].nom)) : ''}</h3><span style="flex:1"></span><button class="btn small" type="button" data-export="tOb" data-name="objetivo_kaf_marcas">Exportar a Excel (CSV)</button></div><div class="tw"><table id="tOb"><thead><tr><th class="l sticky1">Marca</th><th>Peso</th><th>Objetivo por día</th>${vs.length > 1 ? vs.map(v => `<th>${v.cod} · ${esc(titleCase(v.nom).split(' ')[0])} / día</th>`).join('') : ''}<th>Objetivo a la fecha</th><th>Facturado</th><th>Cumplimiento</th><th class="l">De acá a fin de mes</th></tr></thead><tbody>${rb.map(x => `<tr><td class="l sticky1 name">${esc(titleCase(S.provs[x.k]))}</td><td class="ink2">${oD ? (100 * x.o / oD).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + '%' : '—'}</td><td class="tot">${fmtM(x.o)}</td>${vs.length > 1 ? vs.map(v => { const o = O.OD * O.w(v.cod, x.k); return o >= 1 ? `<td>${fmtM(o)}</td>` : '<td class="zero">0</td>'; }).join('') : ''}<td>${fmtM(x.o * O.DJ)}</td><td>${fmtM(x.r)}</td><td>${pct(x.r, x.o * O.DJ)}</td><td class="l">${x.o > 0 ? need(x.o, x.r) : ''}</td></tr>`).join('')}</tbody><tfoot><tr><td class="l sticky1">Total</td><td>100%</td><td>${fmtM(oD)}</td>${vs.length > 1 ? vs.map(v => `<td>${fmtM(odV(v.cod))}</td>`).join('') : ''}<td>${fmtM(oD * O.DJ)}</td><td>${fmtM(rM)}</td><td>${pct(rM, oD * O.DJ)}</td><td class="l">${need(oD, rM)}</td></tr></tfoot></table></div></div></div>`;
  }
  const cell = n => Math.abs(n) < 1 ? '<td class="zero">0</td>' : `<td>${fmtM(n)}</td>`;
  h += `<div class="section"><div class="panel-h"><h3>Facturación por marca y vendedor</h3><span style="flex:1"></span><button class="btn small" type="button" data-export="tK" data-name="facturacion_kaf_por_marca">Exportar a Excel (CSV)</button></div><div class="tw"><table id="tK"><thead><tr><th class="l sticky1">Marca</th>${vs.map(v => `<th>${v.cod} · ${esc(titleCase(v.nom).split(' ')[0])}</th>`).join('')}${vs.length > 1 ? '<th>Total</th>' : ''}<th>% del total</th></tr></thead><tbody>${rowsB.map(r => `<tr><td class="l sticky1 name">${esc(titleCase(r.p))}</td>${vs.map(v => cell(tot[r.i][v.cod] || 0)).join('')}${vs.length > 1 ? `<td class="tot">${Math.abs(r.t) < 1 ? '0' : fmtM(r.t)}</td>` : ''}<td class="ink2">${T ? (100 * r.t / T).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + '%' : '—'}</td></tr>`).join('')}</tbody><tfoot><tr><td class="l sticky1">Total</td>${vs.map(v => `<td>${fmtM(totV[v.cod] || 0)}</td>`).join('')}${vs.length > 1 ? `<td>${fmtM(T)}</td>` : ''}<td>100%</td></tr></tfoot></table></div></div>`;
  const ODS = OBJ ? vs.reduce((a, v) => a + S.provs.reduce((b, p, k) => b + OBJ.OD * OBJ.w(v.cod, k), 0), 0) : 0;
  h += `<div class="section"><div class="panel-h"><h3>Facturación por día</h3><span style="flex:1"></span><button class="btn small" type="button" data-export="tKd" data-name="facturacion_kaf_por_dia">Exportar a Excel (CSV)</button></div><div class="tw"><table id="tKd"><thead><tr><th class="l">Fecha</th><th class="l">Día</th>${vs.map(v => `<th>${v.cod} · ${esc(titleCase(v.nom).split(' ')[0])}</th>`).join('')}${vs.length > 1 ? '<th>Total</th>' : ''}${ODS ? '<th>Objetivo</th><th>Cumplimiento</th>' : ''}</tr></thead><tbody>${sel.map(f => { const e = S.d[f] || {}; const sv = v => Object.values(e[v.cod] || {}).reduce((a, b) => a + b, 0); return `<tr><td class="l name">${fD(f)}</td><td class="l ink2">${DIAS[dow(f)] || 'Domingo'}</td>${vs.map(v => cell(sv(v))).join('')}${vs.length > 1 ? `<td class="tot">${fmtM(porDia[f] || 0)}</td>` : ''}${ODS ? `<td class="ink2">${fmtM(ODS)}</td><td>${(function(r){ return `<span class="cell ${r >= ODS - 0.5 ? 'good' : r >= 0.8 * ODS ? 'warn' : 'bad'}">${Math.floor(100 * r / ODS + 1e-9).toLocaleString('es-AR', { maximumFractionDigits: 0 })}%</span>`; })(porDia[f] || 0)}</td>` : ''}</tr>`; }).join('') || `<tr><td class="l" colspan="${vs.length + 5}">No hay ventas en las fechas elegidas.</td></tr>`}</tbody></table></div></div>`;
  document.getElementById('view').innerHTML = h;
}
document.addEventListener('change', e => { const id = e.target.id; if (id === 'fDesde') st.desde = e.target.value || ini; else if (id === 'fHasta') st.hasta = e.target.value || fin; else if (id === 'fVen') st.ven = e.target.value; else if (id === 'fOrd') st.orden = e.target.value; else return; if (st.hasta < st.desde) st.hasta = st.desde; save(); render(); });
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-ktab]'); if (tb) { st.tab = tb.dataset.ktab; save(); render(); window.scrollTo(0, 0); return; }
  const pv = e.target.closest('[data-plven]'); if (pv) { st.plVen = pv.dataset.plven; save(); render(); return; }
  const d = e.target.closest('[data-dia]'); if (d) { const k = d.dataset.dia; if (k === 'todos') st.dias = []; else st.dias = st.dias.includes(k) ? st.dias.filter(x => x !== k) : st.dias.concat(k); save(); render(); return; }
  if (e.target.id === 'fReset') { st.desde = ini; st.hasta = fin; st.dias = []; save(); render(); return; }
  const ex = e.target.closest('[data-export]'); if (ex) { const tbl = document.getElementById(ex.dataset.export); if (!tbl) return; const lines = [...tbl.querySelectorAll('tr')].map(tr => [...tr.children].map(td => '"' + td.textContent.replace(/\s+/g, ' ').trim().replace(/"/g, '""') + '"').join(';')); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv' })); a.download = ex.dataset.name + '_' + st.desde + '_' + st.hasta + '.csv'; document.body.appendChild(a); a.click(); a.remove(); }
});
render();
</script>
<style>
.octc-wrap{display:grid;gap:16px}

.octc-cup.z{background:var(--surface2,#EAEEF4);color:var(--muted,#738196)}
</style>
<script>
/* Solapa "Cierre de octubre": cupones que juntó cada vendedor en cada concurso de octubre. Datos: CFG.octCierre (publicador). */
(function(){
  const O = (typeof CFG !== 'undefined' && CFG && CFG.octCierre) || null; if (!O) return;
  const ME = (typeof CFG !== 'undefined' && CFG && CFG.octMe) || null;
  const e = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const n = x => Math.round(x || 0).toLocaleString('es-AR');
  const mk = x => '$ ' + ((x || 0) / 1e6).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' M';
  const pc = (x, d) => x == null || x === '' || isNaN(x) ? '—' : (x * 100).toLocaleString('es-AR', { maximumFractionDigits: d || 0 }) + '%';
  const cup = t => `<span class="octc-cup${t ? '' : ' z'}">${t}</span>`;
  const tc = s => String(s || '').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
  const isMe = r => ME && ((ME.cod != null && r.c === ME.cod) || (ME.car && r.n === ME.car));
  function leyenda(){
    const out = [];
    if (!ME) return '';
    const m = ME.cod != null ? O.moto.find(r => r.c === ME.cod) : null;
    const k = ME.cod != null ? O.kaf.find(r => r.c === ME.cod) : null;
    const c = ME.car ? O.car.find(r => r.n === ME.car) : null;
    const tm = O.moto.reduce((a, r) => a + r.t, 0) + O.motoSup.reduce((a, r) => a + r.t, 0);
    if (m) out.push(`<div class="big">${m.t} ${m.t === 1 ? 'cupón' : 'cupones'}</div><div class="sub">En el Incentivo Moto de octubre juntaste <b>${m.t}</b> ${m.t === 1 ? 'cupón' : 'cupones'} (A ${m.A} + B ${m.B} + C ${m.C} + D ${m.D}) de ${tm} en el sorteo: ${pc(m.p, 1)} de probabilidad.</div>`);
    if (k) out.push(`<div class="big">${k.t} ${k.t === 1 ? 'cupón' : 'cupones'}</div><div class="sub">En el concurso Peñaflor KAF de octubre juntaste <b>${k.t}</b> ${k.t === 1 ? 'cupón' : 'cupones'} con ${n(k.pts)} puntos (${pc(k.pm)} del máximo): ${pc(k.p, 1)} de probabilidad en el sorteo.</div>`);
    if (c) out.push(`<div class="big">${c.t} ${c.t === 1 ? 'cupón' : 'cupones'}</div><div class="sub">En Carrileros de octubre juntaste <b>${c.t}</b> ${c.t === 1 ? 'cupón' : 'cupones'}: ${pc(c.p, 1)} de probabilidad en el sorteo.</div>`);
    if (!out.length) return '';
    return `<div class="octc-me">${out.join('<div style="height:10px"></div>')}</div>`;
  }
  function tabla(cols, rows, foot){
    return `<div class="octc-tw"><table><thead><tr>${cols.map(c => `<th class="${c.l ? 'l' : ''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr class="${isMe(r) ? 'me' : ''}">${cols.map(c => `<td class="${c.l ? 'l' : ''}">${c.v(r)}</td>`).join('')}</tr>`).join('')}</tbody>${foot ? `<tfoot>${foot}</tfoot>` : ''}</table></div>`;
  }
  function view(){
    let h = `<div class="octc-wrap">${leyenda()}`;
    const M = O.moto.slice().sort((a, b) => b.t - a.t || b.f / b.o - a.f / a.o);
    const tmV = M.reduce((a, r) => a + r.t, 0), tmS = O.motoSup.reduce((a, r) => a + r.t, 0);
    h += `<div class="octc-sec"><h3>Incentivo Moto · cupones de octubre</h3><p class="note">A = marcas al 100% · B = plus todas las marcas · C = cobertura Georgalos · D = planificación. Tope 15 (más D). ${e(O.fuente)}</p>` +
      tabla([{ h: 'Vendedor', l: 1, v: r => e(r.c + ' · ' + tc(r.n)) }, { h: 'Supervisor', l: 1, v: r => e(tc(r.s)) }, { h: 'Facturado', v: r => mk(r.f) }, { h: '% objetivo', v: r => pc(r.f / r.o) }, { h: 'Marcas al 100%', v: r => r.m + ' de ' + r.mo }, { h: 'A', v: r => r.A }, { h: 'B', v: r => r.B }, { h: 'C', v: r => r.C }, { h: 'D', v: r => r.D }, { h: 'Cupones', v: r => cup(r.t) }, { h: 'Prob.', v: r => pc(r.p, 1) }], M,
        `<tr><td class="l">Total vendedores</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>${tmV}</td><td></td></tr>` + O.motoSup.map(s => `<tr><td class="l">Supervisor ${e(s.n)}</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>${s.t}</td><td>${pc(s.p, 1)}</td></tr>`).join('') + `<tr><td class="l">Total del sorteo</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>${tmV + tmS}</td><td></td></tr>`) + `</div>`;
    const K = O.kaf.slice().sort((a, b) => b.t - a.t || b.pts - a.pts), tk = K.reduce((a, r) => a + r.t, 0) + (O.kafSup ? O.kafSup.t : 0);
    h += `<div class="octc-sec"><h3>Concurso Peñaflor KAF · cupones de octubre</h3><p class="note">Puntaje máximo 130 = CCC 30 + marcas 70 + bonus 10 + P&amp;G 20. Escala: 70% = 1, 80% = 2, 90% = 3, 100% = 5, 115% = 7, 130% = 10 cupones.</p>` +
      tabla([{ h: 'Vendedor', l: 1, v: r => e((r.c ? r.c + ' · ' : '') + tc(r.n)) }, { h: 'CCC', v: r => r.cr + ' / ' + r.co }, { h: 'Marcas al 100%', v: r => e(r.m) }, { h: 'Puntos', v: r => n(r.pts) }, { h: '% del máx.', v: r => pc(r.pm) }, { h: 'Cupones', v: r => cup(r.t) }, { h: 'Prob.', v: r => pc(r.p, 1) }], K.concat(O.kafSup ? [O.kafSup] : []),
        `<tr><td class="l">Total del sorteo</td><td></td><td></td><td></td><td></td><td>${tk}</td><td></td></tr>`) + `</div>`;
    const C = O.car.slice().sort((a, b) => b.t - a.t), tcar = C.reduce((a, r) => a + r.t, 0);
    h += `<div class="octc-sec"><h3>Carrileros · cupones de octubre</h3><p class="note">Cupones por puntos de líneas + plus todas las líneas + duelo de merchand + MPA de espumantes. Máximo 20.</p>` +
      tabla([{ h: 'Merchand', l: 1, v: r => e(r.n) }, { h: 'Líneas en objetivo', v: r => e(r.lin) }, { h: 'Puntos', v: r => n(r.pts) }, { h: 'Por puntos', v: r => r.cp }, { h: 'Duelo', v: r => r.cd }, { h: 'MPA', v: r => r.cm }, { h: 'Cupones', v: r => cup(r.t) }, { h: 'Prob.', v: r => pc(r.p, 1) }], C,
        `<tr><td class="l">Total del sorteo</td><td></td><td></td><td></td><td></td><td></td><td>${tcar}</td><td></td></tr>`) + `</div>`;
    return h + '</div>';
  }
  let activo = false;
  function boton(){
    const t = document.getElementById('tabs'); if (!t || t.querySelector('[data-octc]')) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab'); b.setAttribute('data-octc', '1'); b.textContent = 'Cierre de octubre';
    b.setAttribute('aria-selected', activo ? 'true' : 'false'); t.appendChild(b);
    if (activo) t.querySelectorAll('[data-tab],[data-ktab]').forEach(x => x.setAttribute('aria-selected', 'false'));
  }
  function mostrar(){ activo = true; const v = document.getElementById('view'); if (v) v.innerHTML = view(); boton(); const t = document.getElementById('tabs'); if (t) { t.querySelectorAll('[data-tab],[data-ktab]').forEach(x => x.setAttribute('aria-selected', 'false')); const b = t.querySelector('[data-octc]'); if (b) b.setAttribute('aria-selected', 'true'); } window.scrollTo({ top: 0 }); }
  document.addEventListener('click', ev => {
    if (ev.target.closest('[data-octc]')) { ev.preventDefault(); ev.stopPropagation(); mostrar(); return; }
    if (ev.target.closest('[data-tab],[data-ktab]')) { activo = false; }
  }, true);
  const obs = new MutationObserver(() => boton());
  function init(){ const t = document.getElementById('tabs'); if (!t) return setTimeout(init, 200); boton(); obs.observe(t, { childList: true }); }
  init();
})();
</script>
</body></html>
